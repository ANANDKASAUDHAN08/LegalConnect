# Production HTTPS Server Configuration (NGX-1)
# Activated in production when SSL certificates are provisioned in /etc/letsencrypt/live/
server {
  listen 443 ssl;
  http2 on;
  server_name api.legalconnect.in legalconnect.in *.legalconnect.in;

  ssl_certificate /etc/letsencrypt/live/api.legalconnect.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.legalconnect.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # HSTS Preload (1 Year)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Forward decrypted TLS traffic to internal routing engine on port 80
  location / {
    proxy_pass http://127.0.0.1:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
  }
}