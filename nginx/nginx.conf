events {
  worker_connections 1024;
}

http {
  client_max_body_size 50M;

  # Gzip Compression Configuration
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/js
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss;

  # Upstream definitions with connection pooling (NGX-4)
  upstream dotnet_backend {
    server host.docker.internal:5001 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream node_backend {
    server host.docker.internal:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Gateway Rate Limiting Zones (NGX-3)
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
  limit_req_status 429;

  # Enterprise Security Headers (NGX-2)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:;" always;

  # Upstream Retry & Circuit-Breaker Configuration (NGX-4)
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 3;
  proxy_next_upstream_timeout 5s;

  server {
    listen 80;

    # Let's Encrypt ACME Challenge for Automated SSL/TLS Provisioning (NGX-1)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Route /hubs/* → Dotnet Core API (port 5001) — SignalR Real-Time WebSockets
    location /hubs {
      proxy_pass http://dotnet_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Route /api/admin/* → Dotnet Core API (port 5001) — Admin & Moderation Console
    location /api/admin {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://dotnet_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Route /api/auth/* → Dotnet Core API (port 5001)
    location /api/auth {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://dotnet_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
