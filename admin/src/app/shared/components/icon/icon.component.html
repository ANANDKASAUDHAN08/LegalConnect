<svg [attr.width]="size" [attr.height]="size" viewBox="0 0 24 24" fill="none"
    [attr.stroke]="fill === 'none' ? 'currentColor' : 'none'" [attr.fill]="fill !== 'none' ? fill : 'none'"
    [attr.stroke-width]="strokeWidth" stroke-linecap="round" stroke-linejoin="round" [class]="cssClass">
    <ng-container [ngSwitch]="name">
        <!-- Close / X -->
        <ng-container *ngSwitchCase="'close'">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </ng-container>
        <ng-container *ngSwitchCase="'x'">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </ng-container>

        <!-- Checkmark -->
        <ng-container *ngSwitchCase="'checkmark'">
            <polyline points="20 6 9 17 4 12"></polyline>
        </ng-container>

        <!-- Download -->
        <ng-container *ngSwitchCase="'download'">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </ng-container>

        <!-- Eye / View -->
        <ng-container *ngSwitchCase="'eye'">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </ng-container>

        <!-- Eye Off / Hide -->
        <ng-container *ngSwitchCase="'eye-off'">
            <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
            </path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        </ng-container>

        <!-- Edit / Pencil -->
        <ng-container *ngSwitchCase="'edit'">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </ng-container>

        <!-- Trash / Delete -->
        <ng-container *ngSwitchCase="'trash'">
            <polyline points="3 6 5 6 21 6"></polyline>

        <!-- Refresh -->
        <ng-container *ngSwitchCase="'refresh'">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>

        <!-- Search -->
        <ng-container *ngSwitchCase="'search'">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </ng-container>

        <!-- Chevron Down -->
        <ng-container *ngSwitchCase="'chevron-down'">
            <polyline points="6 9 12 15 18 9"></polyline>
        </ng-container>

        <!-- Plus -->
        <ng-container *ngSwitchCase="'plus'">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>

        <!-- Spinner -->
        <ng-container *ngSwitchCase="'spinner'">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>

        <!-- Star (filled) -->
        <ng-container *ngSwitchCase="'star-filled'">

        </ng-container>

        <!-- Sort Ascending -->

        <!-- Sort Descending -->
