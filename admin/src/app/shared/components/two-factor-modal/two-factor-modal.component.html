@if (enforcer.isOpen()) {
<div class="modal-backdrop" (click)="cancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">
        <admin-icon name="lock" [size]="20" cssClass="text-indigo-500"></admin-icon>
        <span>{{ enforcer.options().title }}</span>
      </div>
      <button class="close-btn" (click)="cancel()">&times;</button>
    </div>

    <div class="modal-body">
      <p class="modal-desc">{{ enforcer.options().actionDescription }}</p>

      <div class="otp-input-group">
        <label>6-Digit Authenticator Code (TOTP)</label>
        <input type="text" maxlength="6" placeholder="123456" [(ngModel)]="code" (keydown.enter)="verify()" autofocus
          class="otp-field" />
        @if (error) {
        <span class="error-text">{{ error }}</span>
        }
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button class="btn btn-primary" (click)="verify()" [disabled]="code.length !== 6">
        {{ enforcer.options().confirmText || 'Authorize & Proceed' }}
      </button>
    </div>
  </div>
</div>
}
