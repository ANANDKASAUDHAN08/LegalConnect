@if (palette.isOpen()) {
<div class="cmd-backdrop" (click)="palette.close()">
  <div class="cmd-modal" (click)="$event.stopPropagation()">
    <div class="cmd-search-header">
      <admin-icon name="search" [size]="20"></admin-icon>
      <input type="text" placeholder="Type a command or search (e.g. Users, Lawyers, Audit Logs, Security)..."
        [(ngModel)]="query" (input)="onSearch()" (keydown)="onKeyDown($event)" autofocus class="cmd-input" />
      <span class="cmd-shortcut-badge">ESC</span>
    </div>

    <div class="cmd-body">
      @if (filteredItems.length === 0) {
      <div class="cmd-empty">
        <p>No matching commands found for "{{ query }}".</p>
      </div>
      } @else {
      <div class="cmd-list">
        @for (item of filteredItems; track item.id; let idx = $index) {
        <div class="cmd-item" [class.active]="selectedIndex === idx" (mouseenter)="selectedIndex = idx"
          (click)="execute(item)">
          <div class="cmd-item-icon">
            <admin-icon
              [name]="item.category === 'Navigation' ? 'layers' : (item.category === 'Directory' ? 'user' : 'activity')"
              [size]="18"></admin-icon>
          </div>
          <div class="cmd-item-content">
            <span class="cmd-item-title">{{ item.title }}</span>
            <span class="cmd-item-desc">{{ item.description }}</span>
          </div>
          <span class="cmd-category-tag">{{ item.category }}</span>
        </div>
        }
      </div>
      }
    </div>

    <div class="cmd-footer">
      <span><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span>
      <span><kbd>↵</kbd> Select</span>
      <span><kbd>ESC</kbd> Close</span>
    </div>
  </div>
</div>
}
