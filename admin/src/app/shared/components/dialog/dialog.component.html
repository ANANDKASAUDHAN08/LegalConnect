@if (dialog) {
<div class="dialog-backdrop" (click)="cancel()">
  <div class="dialog-box" [class]="(dialog.type || 'warning') + '-type'" (click)="$event.stopPropagation()">
    <!-- Dynamic Icon Badge -->
    <div class="dialog-icon-wrapper" [class]="dialog.type || 'warning'">
      <admin-icon
        [name]="dialog.type === 'danger' ? 'alert-triangle' : (dialog.type === 'success' ? 'check-circle' : 'info')"
        [size]="30" [strokeWidth]="2.2"></admin-icon>
    </div>

    <!-- Content -->
    <h3 class="dialog-title">{{ dialog.title }}</h3>
    <p class="dialog-message">{{ dialog.message }}</p>

    <!-- Action Buttons -->
    <div class="dialog-actions">
      @if (!dialog.isAlert) {
      <button class="dialog-btn dialog-btn-cancel" (click)="cancel()">
        {{ dialog.cancelText || 'Cancel' }}
      </button>
      }
      <button class="dialog-btn" [class.dialog-btn-danger]="dialog.type === 'danger'"
        [class.dialog-btn-warning]="dialog.type === 'warning'" [class.dialog-btn-success]="dialog.type === 'success'"
        [class.dialog-btn-primary]="dialog.type === 'info' || !dialog.type" (click)="confirm()">
        {{ dialog.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
}
