<div
    class="pagination p-4 border-t border-slate-800 bg-slate-900/60 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
    <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2">
            <span class="text-slate-300 font-semibold text-xs">Rows per page:</span>
            <admin-select [options]="limitOptions" [value]="limit + ''" (valueChange)="onLimitChange($event)"
                minWidth="130px" dropPosition="auto" [adminTooltip]="'Select number of rows per page'"
                tooltipPosition="top">
            </admin-select>
        </div>
        <span class="hidden md:inline text-slate-700">|</span>
        <div class="page-info text-slate-300 font-medium">
            Showing <strong class="text-white">{{ startRecord }}</strong> to <strong class="text-white">{{ endRecord
                }}</strong> of <strong class="text-white">{{ total }}</strong> records
        </div>
    </div>

    <div class="pagination-controls flex items-center gap-3">
        <button class="btn btn-secondary btn-sm flex items-center gap-1 px-3 py-1.5 rounded-xl font-semibold"
            [disabled]="page <= 1" (click)="changePage(page - 1)" [adminTooltip]="'Previous page results'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Previous</span>
        </button>

        <span class="page-indicator font-medium text-slate-300">
            Page <strong class="text-white">{{ page }}</strong> of <strong class="text-white">{{ pages }}</strong>
        </span>

        <button class="btn btn-secondary btn-sm flex items-center gap-1 px-3 py-1.5 rounded-xl font-semibold"
            [disabled]="page >= pages" (click)="changePage(page + 1)" [adminTooltip]="'Next page results'">
            <span>Next</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>
</div>
