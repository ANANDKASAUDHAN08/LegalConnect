<div class="relative column-customizer-container">
    <button class="btn flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-lg transition-all"
        [ngClass]="isOpen || isCustomized ? 'bg-[#0e2640] text-sky-300 border border-sky-500/45 shadow-[0_0_12px_rgba(14,165,233,0.2)]' : 'bg-slate-800/80 border border-slate-700/80 hover:bg-slate-700/60 text-slate-300 hover:text-white'"
        (click)="toggleOpen()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            class="text-indigo-400" [class.text-sky-400]="isOpen || isCustomized">
            <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7m0-18H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7m0-18v18">
            </path>
        </svg>
        <span>Columns</span>
    </button>

    @if (isOpen) {
    <div
        class="absolute right-0 top-full mt-2 w-52 bg-slate-900 border border-slate-700 rounded-xl p-2.5 shadow-2xl z-30 flex flex-col gap-2 text-xs">
        <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 select-none">
            <span class="font-bold text-slate-400 text-[10px] uppercase tracking-wider">Visible Columns</span>
            <button (click)="toggleAll()"
                class="text-[10px] font-bold text-sky-400 hover:text-sky-300 transition-colors">
                {{ areAllVisible ? 'Deselect All' : 'Select All' }}
            </button>
        </div>
        @for (col of columns; track col.key) {
        <label class="flex items-center gap-2 text-slate-300 cursor-pointer hover:text-white">
            <input type="checkbox" [checked]="visibility[col.key]" (change)="toggleColumn(col.key)"
                class="rounded border-slate-700 bg-slate-800" />
            <span>{{ col.label }}</span>
        </label>
        }
    </div>
    }
</div>
