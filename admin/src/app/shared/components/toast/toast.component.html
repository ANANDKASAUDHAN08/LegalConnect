<div class="toast-container">
  @for (toast of toasts; track toast.id) {
  <div class="toast-card" [class]="toast.type">
    <div class="toast-icon">
      <admin-icon
        [name]="toast.type === 'success' ? 'check-circle' : (toast.type === 'error' ? 'x-circle' : (toast.type === 'warning' ? 'alert-triangle' : 'info'))"
        [size]="18" [strokeWidth]="2.5"></admin-icon>
    </div>

    <div class="toast-body">
      @if (toast.title) {
      <span class="toast-title">{{ toast.title }}</span>
      }
      <span class="toast-message">{{ toast.message }}</span>
    </div>

    @if (toast.actionText) {
    <button class="toast-action-btn" (click)="handleAction(toast)">
      {{ toast.actionText }}
    </button>
    }

    <button class="toast-close" (click)="dismiss(toast.id)">
      <admin-icon name="close" [size]="14"></admin-icon>
    </button>
  </div>
  }
</div>
