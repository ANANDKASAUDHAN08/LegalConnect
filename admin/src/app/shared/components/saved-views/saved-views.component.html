<div class="relative inline-block text-left" #container>
    <button type="button" (click)="toggleMenu()"
        class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-xl transition-all duration-200 border"
        [ngClass]="activePresetId ? 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30 hover:bg-indigo-500/25' : 'bg-slate-800/80 text-slate-300 border-slate-700/80 hover:bg-slate-700/80 hover:text-white'"
        adminTooltip="Saved filter views & custom audit bookmarks" tooltipPosition="top">
        <admin-icon name="bookmark" [size]="14"></admin-icon>
        <span>{{ activePresetName || 'Saved Views' }}</span>
        <admin-icon name="chevron-down" [size]="12" [strokeWidth]="2.5"
            [cssClass]="isOpen ? 'rotate-180 transition-transform duration-200' : 'transition-transform duration-200'"></admin-icon>
    </button>

    @if (isOpen) {
    <div
        class="absolute right-0 mt-2 w-64 rounded-2xl bg-slate-900/95 border border-slate-700/80 shadow-2xl backdrop-blur-xl z-50 p-2 text-xs animate-in">
        <div class="px-2 py-1.5 mb-1 border-b border-slate-800 flex items-center justify-between">
            <span class="font-bold text-slate-200 tracking-wide">Filter Bookmarks</span>
            <span class="text-[10px] text-slate-400 font-mono">{{ presets.length }} saved</span>
        </div>

        <div class="max-h-48 overflow-y-auto space-y-0.5">
            @for (preset of presets; track preset.id) {
            <div class="flex items-center justify-between px-2.5 py-2 rounded-xl hover:bg-slate-800/80 transition-colors cursor-pointer group"
                [ngClass]="{ 'bg-indigo-600/20': preset.id === activePresetId }" (click)="applyPreset(preset, $event)">
                <div class="flex items-center gap-2 truncate">
                    <admin-icon name="star" [size]="12"
                        [cssClass]="preset.id === activePresetId ? 'text-indigo-400 shrink-0' : 'text-slate-400 shrink-0'"></admin-icon>
                    <span class="font-medium text-slate-200 group-hover:text-white truncate"
                        [class.text-indigo-300]="preset.id === activePresetId">
                        {{ preset.name }}
                    </span>
                </div>
                @if (!preset.isDefault) {
                <button type="button" (click)="deletePreset(preset.id, $event)"
                    class="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-rose-400 transition-all rounded-md hover:bg-slate-700/60"
                    adminTooltip="Delete view" tooltipPosition="top">
                    <admin-icon name="close" [size]="12"></admin-icon>
                </button>
                }
            </div>
            }
        </div>

        <!-- Save Current Filter View Form -->
        <div class="mt-2 pt-2 border-t border-slate-800">
            @if (!isNamingView) {
            <button type="button" (click)="startNamingView($event)"
                class="w-full flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 font-semibold transition-colors border border-indigo-500/25">
                <admin-icon name="plus" [size]="12" [strokeWidth]="2.5"></admin-icon>
                <span>Save Current View</span>
            </button>
            } @else {
            <div class="space-y-1.5 p-1" (click)="$event.stopPropagation()">
                <input type="text" [(ngModel)]="newPresetName" (keyup.enter)="saveCurrentView($event)"
                    placeholder="View name (e.g. Delhi Approvals)"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
                <div class="flex items-center gap-1.5 justify-end">
                    <button type="button" (click)="cancelSaveView($event)"
                        class="px-2 py-1 rounded text-slate-400 hover:text-slate-200">Cancel</button>
                    <button type="button" (click)="saveCurrentView($event)"
                        class="px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow-sm">Save</button>
                </div>
            </div>
            }
        </div>
    </div>
    }
</div>
