@if (isOpen) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
  <div
    class="glass-card w-full max-w-lg rounded-2xl border border-white/10 bg-slate-900/90 shadow-2xl overflow-hidden flex flex-col">

    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-white/10 bg-slate-900/50">
      <div class="flex items-center gap-2 text-indigo-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <h3 class="text-lg font-extrabold text-white">Dispatch Platform Announcement</h3>
      </div>
      <button class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors"
        (click)="onClose()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Form Content -->
    <div class="p-5 flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-300">Broadcast Title</label>
        <input type="text" [(ngModel)]="broadcastData.title" placeholder="e.g. System Maintenance Notice"
          class="w-full px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-700 text-white text-sm focus:border-indigo-500 focus:outline-none">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-300">Announcement Content</label>
        <textarea [(ngModel)]="broadcastData.message" rows="3" placeholder="Enter message details for platform users..."
          class="w-full px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-700 text-white text-sm focus:border-indigo-500 focus:outline-none"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-300">Target Audience</label>
          <select [(ngModel)]="broadcastData.targetAudience"
            class="w-full px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-700 text-white text-sm focus:border-indigo-500 focus:outline-none">
            <option value="All">All Users & Lawyers</option>
            <option value="Lawyers">Advocates Only</option>
            <option value="Users">Citizens Only</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-300">Priority Level</label>
          <select [(ngModel)]="broadcastData.priority"
            class="w-full px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-700 text-white text-sm focus:border-indigo-500 focus:outline-none">
            <option value="Normal">Normal Notification</option>
            <option value="High">High Priority Banner</option>
            <option value="Urgent">Emergency Alert</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-4 border-t border-white/10 bg-slate-900/50 flex justify-end gap-2">
      <button class="btn btn-secondary btn-sm" (click)="onClose()">Cancel</button>
      <button class="btn btn-primary btn-sm" [disabled]="isSubmitting || !broadcastData.title"
        (click)="onSubmit()">Dispatch Broadcast</button>
    </div>

  </div>
</div>
}
