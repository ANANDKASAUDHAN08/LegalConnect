<div
  class="resource-map-view-container relative flex flex-col h-[700px] w-full rounded-2xl overflow-hidden border border-slate-700/60 bg-slate-900 shadow-xl">

  <!-- Map Toolbar Overlay Header -->
  <div
    class="absolute top-4 left-4 right-4 z-10 flex flex-wrap items-center justify-between gap-3 p-3 rounded-xl bg-slate-900/90 backdrop-blur-md border border-slate-700/80 shadow-lg">
    <!-- Resource Type Filter Pills -->
    <div class="flex items-center gap-1.5 flex-wrap">
      <button type="button" (click)="setFilterType('ALL')"
        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer border-0"
        [ngClass]="selectedFilterType === 'ALL' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-750'">
        All ({{ resources.length }})
      </button>
      <button type="button" (click)="setFilterType('Court')"
        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer border-0 flex items-center gap-1.5"
        [ngClass]="selectedFilterType === 'Court' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-blue-400 hover:bg-slate-750'">
        <span class="w-2 h-2 rounded-full bg-blue-500"></span> Courts
      </button>
      <button type="button" (click)="setFilterType('LegalAid')"
        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer border-0 flex items-center gap-1.5"
        [ngClass]="selectedFilterType === 'LegalAid' ? 'bg-purple-600 text-white shadow-md' : 'bg-slate-800 text-purple-400 hover:bg-slate-750'">
        <span class="w-2 h-2 rounded-full bg-purple-500"></span> Legal Aid / DLSA
      </button>
      <button type="button" (click)="setFilterType('PoliceStation')"
        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer border-0 flex items-center gap-1.5"
        [ngClass]="selectedFilterType === 'PoliceStation' ? 'bg-amber-600 text-white shadow-md' : 'bg-slate-800 text-amber-400 hover:bg-slate-750'">
        <span class="w-2 h-2 rounded-full bg-amber-500"></span> Police
      </button>
      <button type="button" (click)="setFilterType('GovernmentOffice')"
        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer border-0 flex items-center gap-1.5"
        [ngClass]="selectedFilterType === 'GovernmentOffice' ? 'bg-orange-600 text-white shadow-md' : 'bg-slate-800 text-orange-400 hover:bg-slate-750'">
        <span class="w-2 h-2 rounded-full bg-orange-500"></span> Gov. Offices
      </button>
    </div>

    <!-- Mapped Telemetry Stat -->
    <div class="flex items-center gap-3 text-xs">
      <span class="text-slate-400">
        Geo-Located: <strong class="text-emerald-400">{{ totalMappedCount }}</strong> / {{ resources.length }}
      </span>
    </div>
  </div>

  <!-- Google Map Container -->
  <div #mapContainer class="w-full flex-1 min-h-[500px]"></div>

  <!-- Coverage Gaps Bottom Drawer Banner -->
  <div
    class="p-3 bg-slate-950/95 border-t border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      <span class="font-extrabold text-slate-300 uppercase tracking-wider text-[10px]">
        Coverage Attention Required (&lt;3 institutions):
      </span>
    </div>

    <div class="flex items-center gap-1.5 overflow-x-auto py-1 max-w-2xl scrollbar-thin">
      <span *ngFor="let gap of gapStates.slice(0, 10)"
        class="whitespace-nowrap px-2 py-0.5 rounded-md bg-amber-500/10 border border-amber-500/20 text-amber-300 text-[10px] font-bold">
        {{ gap }}: {{ stateCounts[gap] || 0 }}
      </span>
      <span *ngIf="gapStates.length > 10" class="text-[10px] text-slate-400 font-bold">
        +{{ gapStates.length - 10 }} more
      </span>
    </div>
  </div>
</div>
