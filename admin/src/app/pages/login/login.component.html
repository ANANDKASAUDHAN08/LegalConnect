<div class="min-h-screen w-full flex items-center justify-center p-4 bg-slate-950 relative overflow-hidden">
  <!-- Glowing Background Blurs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <div
    class="glass-card max-w-md w-full rounded-3xl border border-white/10 bg-slate-900/80 backdrop-blur-2xl shadow-2xl p-8 flex flex-col gap-6 animate-in relative z-10">
    <div class="flex flex-col items-center text-center gap-2">
      <div
        class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 flex items-center justify-center shadow-inner mb-1">
        <admin-icon name="layers" [size]="36" strokeWidth="2"></admin-icon>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-100 tracking-tight">LegalConnect Admin</h2>
      <p class="text-xs text-slate-400 font-medium">Control Center & Analytics Portal</p>
    </div>

    @if (errorMessage) {
    <div
      class="p-3.5 rounded-xl border border-red-500/30 bg-red-500/10 text-red-300 text-xs flex items-center gap-2.5 animate-in">
      <admin-icon name="alert-circle" [size]="16" strokeWidth="2" cssClass="shrink-0 text-red-400"></admin-icon>
      <span>{{ errorMessage }}</span>
    </div>
    }

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <!-- Email Input with Clear Button -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-300" for="email">Admin Email</label>
        <div class="relative">
          <input id="email" type="email"
            class="form-input bg-slate-800/80 border-slate-700/80 text-slate-100 placeholder-slate-500 rounded-xl p-3 pr-10 text-sm w-full focus:border-indigo-500 transition-all"
            [(ngModel)]="email" name="email" placeholder="admin@legalconnect.com" required autocomplete="email"
            [adminTooltip]="'Enter admin account email'" tooltipPosition="top" />
          @if (email) {
          <button type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 transition-colors z-10 p-1"
            (click)="email = ''" [adminTooltip]="'Clear email field'" tooltipPosition="left">
            <admin-icon name="close" [size]="14" strokeWidth="2"></admin-icon>
          </button>
          }
        </div>
      </div>

      <!-- Password Input with Clear & Eye Toggle Buttons -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-300" for="password">Password</label>
        <div class="relative">
          <input id="password" [type]="showPassword ? 'text' : 'password'"
            class="form-input bg-slate-800/80 border-slate-700/80 text-slate-100 placeholder-slate-500 rounded-xl p-3 pr-16 text-sm w-full focus:border-indigo-500 transition-all"
            [(ngModel)]="password" name="password" placeholder="••••••••••••" required autocomplete="current-password"
            [adminTooltip]="'Enter admin account password'" tooltipPosition="top" />
          <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1 z-10">
            @if (password) {
            <button type="button" class="text-slate-400 hover:text-slate-200 transition-colors p-1"
              (click)="password = ''" [adminTooltip]="'Clear password field'" tooltipPosition="top">
              <admin-icon name="close" [size]="14" strokeWidth="2"></admin-icon>
            </button>
            }
            <button type="button" class="text-slate-400 hover:text-slate-200 transition-colors p-1"
              (click)="showPassword = !showPassword" [adminTooltip]="showPassword ? 'Hide password' : 'Show password'"
              tooltipPosition="top">
              @if (showPassword) {
              <admin-icon name="eye-off" [size]="15" strokeWidth="2"></admin-icon>
              } @else {
              <admin-icon name="eye" [size]="15" strokeWidth="2"></admin-icon>
              }
            </button>
          </div>
        </div>
      </div>

      <!-- 2FA Code Input with Clear Button -->
      @if (requires2FA) {
      <div class="flex flex-col gap-1.5 animate-in">
        <label class="text-xs font-semibold text-slate-300" for="twoFactorCode">2FA Verification Code</label>
        <div class="relative">
          <input id="twoFactorCode" type="text"
            class="form-input bg-slate-800/80 border-slate-700/80 text-amber-300 font-mono tracking-widest text-center rounded-xl p-3 pr-10 text-sm w-full focus:border-amber-500 transition-all"
            [(ngModel)]="twoFactorCode" name="twoFactorCode" placeholder="6-digit TOTP code" maxlength="6"
            [adminTooltip]="'Open Authenticator App for 6-digit code'" tooltipPosition="top" />
          @if (twoFactorCode) {
          <button type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 transition-colors z-10 p-1"
            (click)="twoFactorCode = ''" [adminTooltip]="'Clear 2FA code'" tooltipPosition="left">
            <admin-icon name="close" [size]="14" strokeWidth="2"></admin-icon>
          </button>
          }
        </div>
      </div>
      }

      <button type="submit"
        class="btn btn-primary w-full py-3.5 px-4 text-xs font-bold rounded-xl flex items-center justify-center gap-2 mt-2 shadow-lg shadow-indigo-600/20"
        [disabled]="isLoading" [adminTooltip]="'Authenticate and open control center'" tooltipPosition="bottom">
        @if (isLoading) {
        <span>Authenticating...</span>
        } @else {
        <span>Sign In to Admin Console</span>
        <admin-icon name="arrow-right" [size]="14" strokeWidth="2"></admin-icon>
        }
      </button>
    </form>

    <div class="flex items-center justify-center gap-1.5 pt-4 border-t border-slate-800/80 text-[11px] text-slate-400">
      <admin-icon name="lock" [size]="12" strokeWidth="2"></admin-icon>
      <span>Restricted Access - Unauthorized entry is strictly logged</span>
    </div>
  </div>
</div>
