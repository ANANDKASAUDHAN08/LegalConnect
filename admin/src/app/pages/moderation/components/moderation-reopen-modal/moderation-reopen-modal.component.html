@if (isOpen && report) {
<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()" role="dialog" aria-modal="true"
    aria-labelledby="reopenModalTitle">
    <div class="modal-header">
      <h3 id="reopenModalTitle" class="text-lg font-black text-white flex items-center gap-2">
        <admin-icon name="refresh" [size]="18" strokeWidth="2.5" cssClass="text-amber-400"></admin-icon>
        <span class="text-amber-400">Re-Open Incident Ticket</span>
        <span class="font-mono text-indigo-400">#{{ report.reportRef }}</span>
      </h3>
      <button (click)="close()" class="text-slate-400 hover:text-white p-1 rounded-lg transition-colors"
        [adminTooltip]="'Close (Esc)'">
        <admin-icon name="close" [size]="16"></admin-icon>
      </button>
    </div>

    <div class="modal-body space-y-4">
      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1">
        <span class="text-slate-500 block">Reported Target:</span>
        <strong class="text-white text-sm">[{{ report.targetType }}] {{ report.targetTitle }}</strong>
        <div class="flex items-center gap-2 pt-1 text-[11px] text-slate-400">
          <span>Status: <strong class="text-amber-300">{{ report.status }}</strong></span>
          @if (report.resolvedByAdminEmail) {
          <span>Resolved By: {{ report.resolvedByAdminEmail }}</span>
          }
        </div>
      </div>

      @if (report.targetType === 'Review') {
      <div class="flex items-center gap-2 p-2.5 rounded-xl bg-amber-950/20 border border-amber-800/30">
        <input type="checkbox" [(ngModel)]="restoreTarget" id="restoreCheck"
          class="rounded bg-slate-900 border-slate-700 text-amber-600 focus:ring-0 cursor-pointer">
        <label for="restoreCheck" class="text-xs text-amber-200 font-medium cursor-pointer">
          Restore target content visibility to "Flagged" during investigation
        </label>
      </div>
      }

      <div class="space-y-1.5">
        <label class="text-xs font-bold text-slate-300 flex items-center justify-between">
          <span>Reason for Re-opening <span class="text-rose-400">*</span>:</span>
          <span class="text-[10px] text-slate-500">Recorded in compliance audit trail</span>
        </label>
        <textarea [(ngModel)]="reason" rows="3"
          placeholder="E.g., Citizen submitted supplementary appeal documentation, new evidence of misconduct discovered..."
          class="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none focus:border-amber-500 font-sans"></textarea>
      </div>
    </div>

    <div class="modal-footer flex items-center justify-end gap-2.5">
      <button (click)="close()" [adminTooltip]="'Cancel and keep current status'"
        class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300">
        Cancel
      </button>
      <button (click)="submit()" [disabled]="!reason.trim() || isProcessing"
        [adminTooltip]="'Re-activate ticket for active investigation'"
        class="px-4 py-2 rounded-xl text-xs font-bold bg-amber-600 hover:bg-amber-500 disabled:opacity-50 disabled:cursor-not-allowed text-white transition-all flex items-center gap-1.5 shadow-md shadow-amber-950">
        @if (isProcessing) {
        <div class="w-3.5 h-3.5 rounded-full border-2 border-white border-t-transparent animate-spin"></div>
        <span>Re-opening...</span>
        } @else {
        <admin-icon name="refresh" [size]="14"></admin-icon>
        <span>Confirm Re-Open</span>
        }
      </button>
    </div>
  </div>
</div>
}
