# Deploy Admin Panel to Firebase Hosting
name: Deploy Admin to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'admin/package-lock.json'

      - name: Install Dependencies
        working-directory: admin
        run: npm ci

      - name: Build Admin Angular Application
        working-directory: admin
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build -- --configuration=production

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGALCONNECT_501109 }}

      - name: Deploy to Firebase Hosting (Admin)
        run: npx firebase-tools deploy --only hosting:admin --project legalconnect-501109