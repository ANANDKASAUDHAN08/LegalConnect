<!-- ========================================================================= -->
<!-- GLOBAL REUSABLE TIME PICKER MODAL -->
<!-- ========================================================================= -->
<div *ngIf="isOpen"
  class="time-picker-backdrop fixed inset-0 z-[2200] flex items-center justify-center p-3.5 sm:p-4 bg-slate-950/80 backdrop-blur-md"
  (click)="onCancel()">

  <!-- Modal Dialog Card -->
  <div
    class="time-picker-dialog w-full max-w-sm rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl p-4 sm:p-5 text-slate-900 dark:text-white space-y-3.5 sm:space-y-4 relative select-none"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800/80">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 border border-current/20 shadow-xs"
          [ngClass]="iconColorClass">
          <app-icon [name]="icon" [size]="16"></app-icon>
        </div>
        <div>
          <h4 class="text-sm font-bold text-slate-900 dark:text-white leading-tight">
            {{ title }}
          </h4>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
            {{ subtitle }}
          </p>
        </div>
      </div>

      <button type="button" (click)="onCancel()"
        class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center transition cursor-pointer text-xs font-bold"
        aria-label="Close time picker">
        ✕
      </button>
    </div>

    <!-- Big Digital Clock Readout with Tactile Steppers -->
    <div
      class="py-2.5 px-3.5 rounded-xl bg-slate-50 dark:bg-slate-950/90 border border-slate-200/90 dark:border-slate-800/80 flex items-center justify-center gap-3 shadow-inner">

      <!-- Hour Display & Steppers -->
      <div class="flex items-center gap-1.5">
        <button type="button" (click)="decrementHour()"
          class="w-6 h-6 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center justify-center transition cursor-pointer shadow-xs active:scale-95"
          aria-label="Previous hour">
          <app-icon name="chevron-down" [size]="12"></app-icon>
        </button>

        <span class="text-3xl font-extrabold font-mono text-slate-900 dark:text-white tracking-tight w-12 text-center">
          {{ draftHour() < 10 ? '0' + draftHour() : draftHour() }} </span>

            <button type="button" (click)="incrementHour()"
              class="w-6 h-6 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center justify-center transition cursor-pointer shadow-xs active:scale-95"
              aria-label="Next hour">
              <app-icon name="chevron-up" [size]="12"></app-icon>
            </button>
      </div>

      <!-- Colon Separator -->
      <span class="text-2xl font-black text-slate-400 dark:text-slate-600 font-mono -mt-0.5">:</span>

      <!-- Minute Display & Steppers -->
      <div class="flex items-center gap-1.5">
        <button type="button" (click)="decrementMinute()"
          class="w-6 h-6 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center justify-center transition cursor-pointer shadow-xs active:scale-95"
          aria-label="Previous minute">
          <app-icon name="chevron-down" [size]="12"></app-icon>
        </button>

        <span class="text-3xl font-extrabold font-mono text-slate-900 dark:text-white tracking-tight w-12 text-center">
          {{ draftMinute() }}
        </span>

        <button type="button" (click)="incrementMinute()"
          class="w-6 h-6 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center justify-center transition cursor-pointer shadow-xs active:scale-95"
          aria-label="Next minute">
          <app-icon name="chevron-up" [size]="12"></app-icon>
        </button>
      </div>

      <!-- Period AM / PM Pill -->
      <button type="button" (click)="togglePeriod()"
        class="text-xs font-bold px-2.5 py-1.5 rounded-lg font-mono transition cursor-pointer border shadow-xs ml-1 active:scale-95"
        [ngClass]="draftPeriod() === 'PM'
          ? 'bg-indigo-600 text-white border-indigo-600'
          : 'bg-amber-500 text-white border-amber-500'" aria-label="Toggle AM/PM">
        {{ draftPeriod() }}
      </button>
    </div>

    <!-- 1-Tap Popular Hours Grid -->
    <div>
      <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 block mb-1.5">
        1-Tap Quick Hours
      </span>
      <div class="grid grid-cols-3 sm:grid-cols-4 gap-1.5">
        <button *ngFor="let opt of quickOptions()" type="button" (click)="selectQuickPreset(opt.value)"
          class="px-2 py-1.5 rounded-lg text-xs font-semibold text-center transition border cursor-pointer active:scale-95"
          [ngClass]="isCurrentPresetActive(opt.value)
            ? 'bg-indigo-600 text-white border-indigo-500 shadow-sm font-bold'
            : 'bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700/60'">
          {{ opt.label }}
        </button>
      </div>
    </div>

    <!-- Custom Adjustment: Beautified In-DOM Custom Dropdowns (Zero OS popup!) -->
    <div class="pt-2 border-t border-slate-200 dark:border-slate-800/80 space-y-2">
      <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
        <span class="font-bold">Custom Adjustment</span>
        <span class="text-[11px] text-slate-400">Select hour, minute &amp; period</span>
      </div>

      <div class="grid grid-cols-3 gap-2 relative">

        <!-- HOUR CUSTOM DROPDOWN -->
        <div class="relative">
          <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1 uppercase tracking-wider">
            Hour
          </label>
          <button type="button" (click)="toggleHourDropdown($event)"
            class="w-full h-9 px-2.5 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700/80 hover:border-indigo-500 dark:hover:border-indigo-500 text-xs font-bold text-slate-900 dark:text-white flex items-center justify-between transition cursor-pointer shadow-xs"
            [class.border-indigo-500]="isHourDropdownOpen()">
            <span>{{ draftHour() < 10 ? '0' + draftHour() : draftHour() }}</span>
                <app-icon name="chevron-down" [size]="13" class="text-slate-400 transition-transform duration-200"
                  [class.rotate-180]="isHourDropdownOpen()">
                </app-icon>
          </button>

          <!-- Floating In-DOM Dropdown Menu (Styled Dark Luxury) -->
          <div *ngIf="isHourDropdownOpen()" (click)="$event.stopPropagation()"
            class="absolute left-0 right-0 top-full mt-1.5 z-50 max-h-44 overflow-y-auto rounded-lg bg-slate-900/98 backdrop-blur-md border border-slate-700 shadow-2xl p-1 space-y-0.5 preferences-scroll-area">
            <button *ngFor="let h of hours12" type="button" (click)="selectHour(h)"
              class="w-full px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center justify-between transition cursor-pointer text-left"
              [ngClass]="draftHour() === h
                ? 'bg-indigo-600 text-white font-bold shadow-xs'
                : 'text-slate-300 hover:bg-slate-800 hover:text-white'">
              <span>{{ h < 10 ? '0' + h : h }}</span>
                  <app-icon *ngIf="draftHour() === h" name="check" [size]="12" class="text-white shrink-0"></app-icon>
            </button>
          </div>
        </div>

        <!-- MINUTE CUSTOM DROPDOWN -->
        <div class="relative">
          <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1 uppercase tracking-wider">
            Minute
          </label>
          <button type="button" (click)="toggleMinuteDropdown($event)"
            class="w-full h-9 px-2.5 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700/80 hover:border-indigo-500 dark:hover:border-indigo-500 text-xs font-bold text-slate-900 dark:text-white flex items-center justify-between transition cursor-pointer shadow-xs"
            [class.border-indigo-500]="isMinuteDropdownOpen()">
            <span>{{ draftMinute() }}</span>
            <app-icon name="chevron-down" [size]="13" class="text-slate-400 transition-transform duration-200"
              [class.rotate-180]="isMinuteDropdownOpen()"></app-icon>
          </button>

          <!-- Floating In-DOM Dropdown Menu (Styled Dark Luxury) -->
          <div *ngIf="isMinuteDropdownOpen()" (click)="$event.stopPropagation()"
            class="absolute left-0 right-0 top-full mt-1.5 z-50 max-h-44 overflow-y-auto rounded-lg bg-slate-900/98 backdrop-blur-md border border-slate-700 shadow-2xl p-1 space-y-0.5 preferences-scroll-area">
            <button *ngFor="let m of minutesList" type="button" (click)="selectMinute(m)"
              class="w-full px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center justify-between transition cursor-pointer text-left"
              [ngClass]="draftMinute() === m
                ? 'bg-indigo-600 text-white font-bold shadow-xs'
                : 'text-slate-300 hover:bg-slate-800 hover:text-white'">
              <span>{{ m }}</span>
              <app-icon *ngIf="draftMinute() === m" name="check" [size]="12" class="text-white shrink-0"></app-icon>
            </button>
          </div>
        </div>

        <!-- PERIOD AM / PM SEGMENTED SWITCH -->
        <div>
          <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1 uppercase tracking-wider">
            Period
          </label>
          <div
            class="flex rounded-lg bg-slate-100 dark:bg-slate-950 p-0.5 border border-slate-300 dark:border-slate-700/80 h-9 items-center">
            <button type="button" (click)="setPeriod('AM')"
              class="flex-1 h-full rounded-lg text-xs font-bold transition flex items-center justify-center cursor-pointer"
              [ngClass]="draftPeriod() === 'AM'
                ? 'bg-indigo-600 text-white shadow-xs'
                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'">
              AM
            </button>
            <button type="button" (click)="setPeriod('PM')"
              class="flex-1 h-full rounded-lg text-xs font-bold transition flex items-center justify-center cursor-pointer"
              [ngClass]="draftPeriod() === 'PM'
                ? 'bg-indigo-600 text-white shadow-xs'
                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'">
              PM
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Dialog Footer Actions -->
    <div class="flex items-center justify-between pt-2.5 border-t border-slate-200 dark:border-slate-800/80">
      <div class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">
        Selected: <strong class="text-indigo-600 dark:text-indigo-400 font-mono">{{ formattedCurrentDraft() }}</strong>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" (click)="onCancel()"
          class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
          Cancel
        </button>
        <button type="button" (click)="apply()"
          class="px-4 py-1.5 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 transition shadow-sm shadow-indigo-500/25 cursor-pointer active:scale-95">
          Apply Time
        </button>
      </div>
    </div>

  </div>
</div>
