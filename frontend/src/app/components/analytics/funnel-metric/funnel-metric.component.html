<div class="space-y-4">
    <div class="flex items-center justify-between">
        <div>
            <h4 class="text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-500">
                Acquisition Pipeline
            </h4>
            <p class="text-[10px] text-slate-400 dark:text-slate-500 mt-0.5">Visitor to retained client conversion flow
            </p>
        </div>
        <span appTooltip="Overall conversion efficiency from directory impression to retained client matter"
            class="text-xs font-mono font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/40 px-2 py-0.5 rounded-md cursor-help">
            {{ overallConversionRate }}% Total Conversion
        </span>
    </div>

    <!-- Funnel Horizontal Steps -->
    <div class="space-y-2.5">
        <div *ngFor="let step of steps; let i = index; let last = last" class="group">
            <!-- Step Row Header -->
            <div class="flex items-center justify-between text-xs mb-1">
                <div class="flex items-center gap-2">
                    <span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold" [ngClass]="i === 0 ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300' : 
                           (i === 1 ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/60 dark:text-amber-300' : 
                           'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300')">
                        {{ i + 1 }}
                    </span>
                    <span class="font-bold text-slate-800 dark:text-slate-200">{{ step.name }}</span>
                </div>

                <div class="flex items-center gap-2 font-mono">
                    <span class="font-bold text-slate-900 dark:text-white">{{ step.count }}</span>
                    <span *ngIf="step.deltaPct !== undefined" class="text-[10px] font-bold flex items-center gap-0.5"
                        [ngClass]="step.deltaPct >= 0 ? 'text-emerald-500' : 'text-rose-500'">
                        <span>{{ step.deltaPct >= 0 ? '+' : '' }}{{ step.deltaPct }}%</span>
                    </span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="h-2 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden relative">
                <div class="h-full rounded-full transition-all duration-700 ease-out" [ngClass]="step.colorClass"
                    [style.width.%]="getStepWidth(step.count)">
                </div>
            </div>

            <!-- Step Conversion Dropdown Indicator -->
            <div *ngIf="!last && step.conversionFromPrev" class="flex justify-end pr-2 pt-0.5">
                <span class="text-[9px] text-slate-400 dark:text-slate-500 flex items-center gap-1 font-mono">
                    <svg class="w-2.5 h-2.5 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                    </svg>
                    {{ step.conversionFromPrev }}% throughput
                </span>
            </div>
        </div>
    </div>
</div>
