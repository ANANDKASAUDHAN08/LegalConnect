<div *ngIf="isOpen" class="fixed inset-0 z-[2100] flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-md transition-opacity" (click)="onCancel()"></div>

  <!-- Modal Content Box -->
  <div
    class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 shadow-2xl z-10 space-y-5 border border-slate-200/80 dark:border-slate-800 animate-[scaleUp_0.2s_ease-out]">
    <div class="flex items-start gap-4">
      <!-- Icon indicator -->
      <div class="p-3 rounded-2xl shrink-0 animate-scale-up border"
        [ngClass]="type === 'danger' ? 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/20 dark:border-rose-500/30' : (type === 'info' ? 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20 dark:border-blue-500/30' : 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/30 dark:border-amber-500/40')">
        <ng-container [ngSwitch]="getIconName()">
          <app-icon *ngSwitchCase="'report'" name="flag" [size]="22"></app-icon>
          <app-icon *ngSwitchCase="'dispute'" name="alert-triangle" [size]="22"></app-icon>
          <app-icon *ngSwitchCase="'trash'" name="trash-2" [size]="22"></app-icon>
          <app-icon *ngSwitchCase="'sync'" name="refresh" [size]="22"></app-icon>
          <app-icon *ngSwitchCase="'info'" name="info" [size]="22"></app-icon>
          <app-icon *ngSwitchDefault name="alert-triangle" [size]="22"></app-icon>
        </ng-container>
      </div>
      <div class="space-y-1 pr-2">
        <h3 class="text-base font-extrabold text-slate-900 dark:text-white tracking-tight">{{ title }}</h3>
        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed font-normal">{{ message }}</p>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-800/80">
      <button (click)="onCancel()" [appTooltip]="'Cancel and dismiss dialog'" tooltipPlacement="top"
        class="px-4 py-2.5 border border-slate-200 dark:border-slate-700/80 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-bold transition-all bg-transparent cursor-pointer outline-none">
        Cancel
      </button>
      <button (click)="onConfirm()" [appTooltip]="'Confirm and proceed'" tooltipPlacement="top"
        [ngClass]="type === 'danger'
          ? 'bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white shadow-md shadow-rose-500/20'
          : (type === 'info'
            ? 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-md shadow-blue-500/20'
            : 'bg-gradient-to-r from-amber-500 via-amber-400 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black shadow-md shadow-amber-500/20')"
        class="px-5 py-2.5 rounded-xl text-xs font-extrabold transition-all shadow-md active:scale-95 border-0 cursor-pointer outline-none">
        Confirm
      </button>
    </div>
  </div>
</div>
