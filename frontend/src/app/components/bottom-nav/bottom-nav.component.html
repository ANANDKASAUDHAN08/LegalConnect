<!-- Primary Accessible Mobile Bottom Navigation Bar -->
<nav class="bottom-nav-container md:hidden" role="navigation" aria-label="Mobile Primary Navigation"
  [class.nav-hidden]="isKeyboardVisible || !showNav">

  <div class="bottom-nav-inner grid grid-cols-5 items-center justify-items-center relative w-full h-[52px]"
    role="tablist">

    <!-- Active Indicator Pill -->
    <div class="active-indicator-pill" [attr.data-active-tab]="activeTab" aria-hidden="true"></div>

    <!-- Tab 1: Home -->
    <a routerLink="/home" class="bottom-nav-item" [class.active]="activeTab === 'home'" role="tab"
      [attr.aria-selected]="activeTab === 'home'" [attr.aria-current]="activeTab === 'home' ? 'page' : null"
      aria-label="Home" appTooltip="Home Feed" tooltipPlacement="top">
      <app-icon name="home" [size]="20" aria-hidden="true"></app-icon>
      <span class="tab-label">Home</span>
    </a>

    <!-- Tab 2: Laws -->
    <a routerLink="/laws" class="bottom-nav-item" [class.active]="activeTab === 'laws'" role="tab"
      [attr.aria-selected]="activeTab === 'laws'" [attr.aria-current]="activeTab === 'laws' ? 'page' : null"
      aria-label="Bare Acts and Laws" appTooltip="Bare Acts & Laws" tooltipPlacement="top">
      <app-icon name="book-open" [size]="20" aria-hidden="true"></app-icon>
      <span class="tab-label">Laws</span>
    </a>

    <!-- Tab 3: Center High-Contrast SOS Beacon -->
    <button (click)="toggleSos($event)" class="bottom-nav-sos-btn" [class.sos-active]="showSosOverlay" type="button"
      role="button" [attr.aria-expanded]="showSosOverlay" aria-haspopup="dialog" aria-controls="emergency-sos-sheet"
      aria-label="Emergency SOS and Free Legal Aid Console" appTooltip="Emergency SOS Console" tooltipPlacement="top">

      <!-- Pulsing Beacon Rings -->
      <span class="sos-glow-ring" aria-hidden="true"></span>
      <span class="sos-glow-ring-2" aria-hidden="true"></span>

      <app-icon name="alert-triangle" [size]="18" class="text-white mb-0.5" aria-hidden="true"></app-icon>
      <span class="text-[0.52rem] text-white font-black uppercase tracking-wider leading-none">
        SOS
      </span>
    </button>

    <!-- Tab 4: Role-Adaptive Lawyers / Directory Link -->
    <ng-container *ngIf="(auth.currentUser$ | async) as user; else guestTab4">
      <a *ngIf="user.role === 'Lawyer'" routerLink="/legal-resources" class="bottom-nav-item"
        [class.active]="activeTab === 'lawyers'" role="tab" [attr.aria-selected]="activeTab === 'lawyers'"
        [attr.aria-current]="activeTab === 'lawyers' ? 'page' : null" aria-label="Legal Directory"
        appTooltip="Legal Aid & Court Directory" tooltipPlacement="top">
        <app-icon name="landmark" [size]="20" aria-hidden="true"></app-icon>
        <span class="tab-label">Directory</span>
      </a>

      <a *ngIf="user.role !== 'Lawyer'" routerLink="/lawyers" class="bottom-nav-item"
        [class.active]="activeTab === 'lawyers'" role="tab" [attr.aria-selected]="activeTab === 'lawyers'"
        [attr.aria-current]="activeTab === 'lawyers' ? 'page' : null" aria-label="Find Lawyers"
        appTooltip="Find Verified Advocates" tooltipPlacement="top">
        <app-icon name="users" [size]="20" aria-hidden="true"></app-icon>
        <span class="tab-label">Lawyers</span>
      </a>
    </ng-container>

    <ng-template #guestTab4>
      <a routerLink="/lawyers" class="bottom-nav-item" [class.active]="activeTab === 'lawyers'" role="tab"
        [attr.aria-selected]="activeTab === 'lawyers'" [attr.aria-current]="activeTab === 'lawyers' ? 'page' : null"
        aria-label="Find Lawyers" appTooltip="Find Verified Advocates" tooltipPlacement="top">
        <app-icon name="users" [size]="20" aria-hidden="true"></app-icon>
        <span class="tab-label">Lawyers</span>
      </a>
    </ng-template>

    <!-- Tab 5: Workspace / Dashboard / Account -->
    <ng-container *ngIf="(auth.currentUser$ | async) as user; else guestTab">
      <a [routerLink]="getDashboardRoute(user)" class="bottom-nav-item relative"
        [class.active]="activeTab === 'dashboard'" role="tab" [attr.aria-selected]="activeTab === 'dashboard'"
        [attr.aria-current]="activeTab === 'dashboard' ? 'page' : null"
        [attr.aria-label]="user.role === 'Lawyer' ? 'Advocate Workstation' : 'Client Dashboard'"
        [appTooltip]="user.role === 'Lawyer' ? 'Advocate Workstation' : 'Client Dashboard'" tooltipPlacement="top">

        <!-- Live appointment ambient indicator ring -->
        <span *ngIf="hasUpcomingAppointment" class="live-consultation-pulse-ring" aria-hidden="true"></span>

        <app-icon [name]="user.role === 'Lawyer' ? 'briefcase' : 'layout'" [size]="20" aria-hidden="true"></app-icon>
        <span class="tab-label">{{ user.role === 'Lawyer' ? 'Workstation' : 'Dashboard' }}</span>
      </a>
    </ng-container>

    <ng-template #guestTab>
      <a routerLink="/login" class="bottom-nav-item" [class.active]="activeTab === 'dashboard'" role="tab"
        [attr.aria-selected]="activeTab === 'dashboard'" aria-label="Sign In or User Profile"
        appTooltip="Sign In / Account" tooltipPlacement="top">
        <app-icon name="user" [size]="20" aria-hidden="true"></app-icon>
        <span class="tab-label">Profile</span>
      </a>
    </ng-template>

  </div>
</nav>

<!-- Desktop Floating Emergency SOS Beacon FAB -->
<button (click)="toggleSos($event)"
  class="desktop-sos-fab hidden md:flex flex-col items-center justify-center fixed bottom-6 right-6 z-[2001] w-14 h-14 rounded-full text-white transition-all duration-200 border cursor-pointer select-none"
  [ngClass]="showSosOverlay 
    ? 'bg-slate-900 border-red-500/60 shadow-[0_8px_24px_rgba(0,0,0,0.6)] hover:bg-slate-800' 
    : 'bg-gradient-to-br from-red-500 via-rose-600 to-red-650 border-white/25 shadow-[0_8px_24px_rgba(220,38,38,0.45)] hover:shadow-[0_12px_32px_rgba(220,38,38,0.65)] hover:scale-105 active:scale-95'"
  type="button" role="button" [attr.aria-expanded]="showSosOverlay" aria-haspopup="dialog"
  aria-controls="emergency-sos-sheet"
  [attr.aria-label]="showSosOverlay ? 'Close Emergency Console' : 'Emergency Assistance Console'"
  [appTooltip]="showSosOverlay ? 'Close Emergency Console' : 'Emergency SOS Console (112, 1091, 1930, 15100)'"
  tooltipPlacement="left">

  <!-- Radar ping ring when idle/closed -->
  <span class="absolute -inset-1 rounded-full border border-red-500/40 animate-ping pointer-events-none"
    *ngIf="!showSosOverlay"></span>

  <app-icon [name]="showSosOverlay ? 'x' : 'alert-triangle'" [size]="showSosOverlay ? 20 : 18" class="text-white"
    [class.animate-pulse]="!showSosOverlay" aria-hidden="true"></app-icon>
  <span class="text-[0.58rem] font-black uppercase tracking-wider leading-none mt-0.5">
    {{ showSosOverlay ? 'CLOSE' : 'SOS' }}
  </span>
</button>

<!-- Lazy-Loaded Emergency Assistance Console Component -->
@defer (when showSosOverlay) {
@if (showSosOverlay) {
<app-sos-modal [isOpen]="showSosOverlay" (closeModal)="closeSos()"></app-sos-modal>
}
}
