<div class="space-y-1.5">
  <!-- Label -->
  <label *ngIf="label" [attr.for]="inputId"
    class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">
    {{ label }}
  </label>

  <!-- Trigger Button -->
  <div class="relative">
    <button type="button" [id]="inputId" (click)="toggleCalendar()" [disabled]="disabled()"
      [attr.aria-expanded]="showCalendar()" [attr.aria-describedby]="errorId || null" aria-haspopup="dialog"
      class="w-full flex items-center gap-2.5 pl-3.5 pr-3.5 py-2.5 rounded-xl bg-slate-50/50 dark:bg-slate-950/40 border text-sm transition-all duration-200 text-left outline-none"
      [class.cursor-pointer]="!disabled()" [class.cursor-not-allowed]="disabled()" [class.opacity-60]="disabled()"
      [ngClass]="showCalendar()
        ? 'border-amber-500 ring-4 ring-amber-500/10'
        : 'border-slate-200 dark:border-slate-800/80 hover:border-slate-300 dark:hover:border-slate-700'">
      <app-icon name="calendar" [size]="16" class="text-slate-400 dark:text-slate-500 shrink-0"></app-icon>
      <span [ngClass]="displayValue()
        ? 'text-slate-900 dark:text-white font-medium'
        : 'text-slate-400 dark:text-slate-500'">
        {{ displayValue() || placeholder }}
      </span>
    </button>

    <!-- Backdrop -->
    <div *ngIf="showCalendar()" class="fixed inset-0 z-20 bg-transparent" (click)="closeCalendar()"></div>

    <!-- Calendar Dropdown -->
    <div *ngIf="showCalendar()" role="dialog" aria-label="Date picker calendar"
      class="absolute z-30 left-0 right-0 sm:right-auto mt-1.5 w-full sm:w-72 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl shadow-slate-900/10 dark:shadow-black/50 overflow-hidden animate-[fadeIn_0.12s_ease-out]">

      <!-- Month / Year Header -->
      <div class="flex items-center justify-between px-3 py-2 border-b border-slate-100 dark:border-slate-800">
        <button type="button" (click)="prevMonth(); $event.stopPropagation()" aria-label="Previous month"
          class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all border-0 bg-transparent cursor-pointer">
          <app-icon name="chevron-left" [size]="14"></app-icon>
        </button>

        <div class="flex items-center gap-1.5">
          <!-- Month Select -->
          <div
            class="relative flex items-center bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-0.5 shadow-sm hover:border-amber-500/50 transition-all">
            <select [ngModel]="calendarMonth()" (ngModelChange)="onMonthChange($event)" aria-label="Select month"
              class="appearance-none bg-transparent text-[11px] font-bold text-slate-900 dark:text-white border-0 outline-none cursor-pointer focus:ring-0 p-0 pr-4">
              <option *ngFor="let name of monthNames; let i = index; trackBy: trackByString" [value]="i"
                class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
                {{ name }}
              </option>
            </select>
            <div class="absolute right-1.5 flex items-center pointer-events-none text-slate-400">
              <app-icon name="chevron-down" [size]="10"></app-icon>
            </div>
          </div>

          <!-- Year Select -->
          <div
            class="relative flex items-center bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-0.5 shadow-sm hover:border-amber-500/50 transition-all">
            <select [ngModel]="calendarYear()" (ngModelChange)="onYearChange($event)" aria-label="Select year"
              class="appearance-none bg-transparent text-[11px] font-bold text-slate-900 dark:text-white border-0 outline-none cursor-pointer focus:ring-0 p-0 pr-4">
              <option *ngFor="let y of yearOptions(); trackBy: trackByNumber" [value]="y"
                class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
                {{ y }}
              </option>
            </select>
            <div class="absolute right-1.5 flex items-center pointer-events-none text-slate-400">
              <app-icon name="chevron-down" [size]="10"></app-icon>
            </div>
          </div>
        </div>

        <button type="button" (click)="nextMonth(); $event.stopPropagation()" aria-label="Next month"
          class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all border-0 bg-transparent cursor-pointer">
          <app-icon name="chevron-right" [size]="14"></app-icon>
        </button>
      </div>

      <!-- Weekday Headers -->
      <div class="grid grid-cols-7 px-3 pt-2 pb-0.5" role="row">
        <div *ngFor="let wd of weekDays; trackBy: trackByString" role="columnheader"
          class="text-center text-[9px] font-bold text-slate-400 uppercase tracking-widest py-0.5">
          {{ wd }}
        </div>
      </div>

      <!-- Day Grid -->
      <div class="grid grid-cols-7 px-3 pb-1.5 gap-0.5" role="grid">
        <ng-container *ngFor="let date of calendarDays(); trackBy: trackByDay">
          <button *ngIf="date" type="button" (click)="selectDate(date); $event.stopPropagation()"
            [attr.aria-label]="date.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })"
            [attr.aria-selected]="isSelected(date)" [attr.aria-current]="isToday(date) ? 'date' : null"
            class="w-full aspect-square h-8 flex items-center justify-center text-xs font-semibold rounded-lg transition-all duration-150 active:scale-90 border-0 bg-transparent cursor-pointer"
            [ngClass]="isSelected(date)
              ? 'bg-gradient-to-br from-amber-500 to-amber-600 text-white shadow-md shadow-amber-500/20 scale-105'
              : isToday(date)
                ? 'ring-2 ring-amber-400 text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-900/10'
                : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'">
            {{ date.getDate() }}
          </button>
          <div *ngIf="!date" class="w-full aspect-square h-8" aria-hidden="true"></div>
        </ng-container>
      </div>

      <!-- Footer -->
      <div
        class="flex items-center justify-between px-3.5 py-2 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/40">
        <button type="button" (click)="closeCalendar()"
          class="text-[10px] text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 font-bold transition-colors py-1 px-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 border-0 bg-transparent cursor-pointer">
          Cancel
        </button>
        <div class="flex items-center gap-1.5">
          <button type="button" (click)="clearDate()"
            class="text-[10px] text-red-500 hover:text-red-600 dark:text-red-400 font-semibold transition-colors py-1 px-2 rounded hover:bg-red-50 dark:hover:bg-red-900/10 border-0 bg-transparent cursor-pointer">
            Clear
          </button>
          <button type="button" (click)="goToToday(); $event.stopPropagation()"
            class="text-[10px] text-amber-600 dark:text-amber-400 font-bold transition-colors py-1 px-2 rounded hover:bg-amber-50 dark:hover:bg-amber-900/10 border-0 bg-transparent cursor-pointer">
            Today
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
