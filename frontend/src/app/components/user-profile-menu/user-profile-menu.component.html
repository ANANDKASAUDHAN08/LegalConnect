<div class="relative user-profile-menu-container" appNavDropdown #profileDropdown="appNavDropdown">
  <!-- Avatar Trigger -->
  <button appNavDropdownTrigger
    class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-extrabold flex items-center justify-center cursor-pointer shadow-md select-none border-2 border-white dark:border-slate-900 hover:scale-105 transition-transform duration-200"
    [class.ring-2]="profileDropdown.isOpen" [class.ring-blue-500]="profileDropdown.isOpen">
    {{ (currentUser?.fullName || 'U')[0] | uppercase }}
  </button>

  <!-- Dropdown Card Container -->
  <div appNavDropdownPanel
    class="user-profile-dropdown w-64 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-xl dark:shadow-[0_12px_40px_rgba(0,0,0,0.6)] p-3.5 flex flex-col gap-2.5">

    <!-- User Info Header -->
    <div class="flex items-center gap-3 pb-2.5 border-b border-slate-100 dark:border-slate-800/80">
      <div
        class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-500 text-white font-black flex items-center justify-center text-sm shadow-inner flex-shrink-0">
        {{ (currentUser?.fullName || 'U')[0] | uppercase }}
      </div>
      <div class="flex flex-col min-w-0">
        <span class="text-[0.88rem] font-bold text-slate-900 dark:text-slate-100 truncate leading-snug">
          {{ currentUser?.fullName }}
        </span>
        <span class="text-[0.72rem] text-slate-500 dark:text-slate-400 truncate leading-none mt-0.5">
          {{ currentUser?.email }}
        </span>
      </div>
    </div>

    <!-- Navigation Links -->
    <div class="flex flex-col gap-1">
      <!-- Client options -->
      <ng-container *ngIf="currentUser?.role !== 'Lawyer'">
        <a routerLink="/client/portal"
          class="profile-dropdown-link group flex items-center gap-3 px-2.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 no-underline transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/80 hover:text-blue-600 dark:hover:text-blue-400">
          <app-icon name="bookmark" [size]="16"
            class="text-slate-400 dark:text-slate-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors"></app-icon>
          <span class="text-[0.84rem] font-semibold">My Library</span>
        </a>
      </ng-container>

      <!-- Lawyer options -->
      <ng-container *ngIf="currentUser?.role === 'Lawyer'">
        <a routerLink="/lawyer/workstation"
          class="profile-dropdown-link group flex items-center gap-3 px-2.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 no-underline transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/80 hover:text-blue-600 dark:hover:text-blue-400">
          <app-icon name="layout" [size]="16"
            class="text-slate-400 dark:text-slate-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors"></app-icon>
          <span class="text-[0.84rem] font-semibold">Advocate Workspace</span>
        </a>
      </ng-container>

      <!-- Profile (Shared) -->
      <a routerLink="/profile"
        class="profile-dropdown-link group flex items-center gap-3 px-2.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 no-underline transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/80 hover:text-blue-600 dark:hover:text-blue-400">
        <app-icon name="user" [size]="16"
          class="text-slate-400 dark:text-slate-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors"></app-icon>
        <span class="text-[0.84rem] font-semibold">Profile</span>
      </a>

      <!-- Settings (Shared) -->
      <a routerLink="/settings"
        class="profile-dropdown-link group flex items-center gap-3 px-2.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 no-underline transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/80 hover:text-blue-600 dark:hover:text-blue-400">
        <app-icon name="settings" [size]="16"
          class="text-slate-400 dark:text-slate-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors"></app-icon>
        <span class="text-[0.84rem] font-semibold">Settings</span>
      </a>

      <!-- Install Desktop App (PWA) -->
      <button *ngIf="!pwaInstall.isStandalone()" (click)="pwaInstall.promptInstall()"
        class="profile-dropdown-link group flex w-full items-center gap-3 px-2.5 py-2 rounded-xl text-blue-600 dark:text-blue-400 hover:bg-blue-50/50 dark:hover:bg-blue-950/30 no-underline transition-colors bg-transparent border-0 cursor-pointer text-left"
        appTooltip="Install LegalConnect application to desktop/phone" tooltipPlacement="left">
        <app-icon name="download" [size]="16"></app-icon>
        <span class="text-[0.84rem] font-bold">Install App</span>
      </button>

      <div class="h-px bg-slate-100 dark:bg-slate-800/80 my-0.5"></div>

      <!-- Logout Button (Common) -->
      <button (click)="logout.emit()"
        class="profile-dropdown-link group flex w-full items-center gap-3 px-2.5 py-2 rounded-xl text-rose-600 dark:text-rose-400 hover:bg-rose-50/50 dark:hover:bg-rose-950/30 no-underline transition-colors bg-transparent border-0 cursor-pointer text-left">
        <app-icon name="arrow-right" [size]="16"></app-icon>
        <span class="text-[0.84rem] font-bold">Sign Out</span>
      </button>
    </div>
  </div>
</div>
