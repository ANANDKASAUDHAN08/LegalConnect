<div
  class="snackbar-stack fixed bottom-8 left-1/2 -translate-x-1/2 z-[9999] flex flex-col-reverse items-center gap-2.5 pointer-events-none">

  <div *ngFor="let toast of snackbarService.visibleToasts(); trackBy: trackById; let i = index"
    class="snackbar-item pointer-events-auto transition-all duration-200" [class.snackbar-exit]="toast.exiting"
    [style.transform]="'scale(' + (1 - i * 0.03) + ')'" [style.opacity]="1 - i * 0.15">

    <div
      class="snackbar flex items-center justify-between gap-4 sm:gap-6 px-4 py-2.5 sm:px-5 sm:py-3.5 rounded-xl shadow-lg w-max max-w-[92vw] sm:max-w-fit"
      [ngClass]="{
           'bg-[#27ae60] text-white': toast.type === 'success',
           'bg-[#e74c3c] text-white': toast.type === 'error',
           'bg-[#2980b9] text-white': toast.type === 'info',
           'bg-[#f59e0b] text-[#1f2937]': toast.type === 'warning'
         }">

      <!-- Message -->
      <p class="message font-medium text-[13.5px] sm:text-[15px] tracking-wide leading-snug">{{ toast.message }}</p>

      <!-- Optional Action Button (Undo, etc.) -->
      <button *ngIf="toast.actionLabel" (click)="snackbarService.runAction(toast.id)"
        class="shrink-0 font-extrabold text-[12px] sm:text-[13px] underline underline-offset-2 opacity-90 hover:opacity-100 cursor-pointer bg-transparent border-none transition-opacity whitespace-nowrap"
        [ngClass]="{'text-[#1f2937]': toast.type === 'warning', 'text-white': toast.type !== 'warning'}">
        {{ toast.actionLabel }}
      </button>

      <!-- Close Button -->
      <button (click)="snackbarService.dismiss(toast.id)"
        class="opacity-70 hover:opacity-100 transition-opacity text-lg sm:text-xl font-bold leading-none -mt-0.5 shrink-0 bg-transparent border-none cursor-pointer"
        [ngClass]="{'text-[#1f2937]': toast.type === 'warning', 'text-white': toast.type !== 'warning'}"
        aria-label="Close">
        ✕
      </button>
    </div>
  </div>

</div>
