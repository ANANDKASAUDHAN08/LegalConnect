<button type="button" (click)="onReport($event)" [appTooltip]="tooltipText()" tooltipPlacement="top"
  [attr.aria-label]="tooltipText()"
  class="inline-flex items-center justify-center gap-1.5 h-7 px-2.5 rounded-lg text-[11px] font-bold border transition-all cursor-pointer select-none"
  [ngClass]="isReported()
    ? 'border-amber-500/40 bg-amber-500/10 text-amber-600 dark:text-amber-400 hover:bg-amber-500/20 shadow-sm'
    : 'border-slate-200/90 dark:border-slate-800 bg-slate-100/90 dark:bg-slate-800/90 text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 hover:border-rose-300 dark:hover:border-rose-900/50'">
  <app-icon [name]="isReported() ? 'check-circle' : 'flag'" [size]="12"></app-icon>
  <span *ngIf="showLabel()">{{ isReported() ? 'Reported' : 'Report' }}</span>
</button>
