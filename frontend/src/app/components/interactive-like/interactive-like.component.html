<button [class]="buttonClasses()" [class.liked]="state().liked" [attr.aria-pressed]="state().liked"
    [attr.aria-label]="ariaLabel()" [appTooltip]="tooltipText()" [tooltipPlacement]="'top'" (click)="onToggle($event)"
    role="button" tabindex="0" (keydown.enter)="onToggle($event)" (keydown.space)="onToggle($event)">

    <!-- Thumbs Up variant -->
    <app-icon *ngIf="variant() === 'pill' || variant() === 'icon-only' || variant() === 'counter-badge'"
        [name]="state().liked ? 'thumbs-up-filled' : 'thumbs-up'" [size]="iconPixelSize"
        [class]="state().liked ? 'text-emerald-600 dark:text-emerald-400 fill-current' : 'text-slate-500 dark:text-slate-400'"></app-icon>

    <!-- Heart variant -->
    <app-icon *ngIf="variant() === 'thumbs'" name="heart" [size]="iconPixelSize"
        [class]="state().liked ? 'text-rose-500 fill-current' : 'text-slate-500 dark:text-slate-400'"></app-icon>

    <!-- Count label: shimmer while loading, real count when hydrated -->
    <ng-container *ngIf="variant() !== 'icon-only'">
        <span *ngIf="isHydrated(); else countShimmer" class="like-count">{{ state().count }}</span>
        <ng-template #countShimmer>
            <span class="like-count"><span class="count-shimmer"></span></span>
        </ng-template>
    </ng-container>
</button>
