<div (click)="onCancel()"
  class="fixed inset-0 z-[99999] bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 md:p-6 overflow-hidden scrollbar-none">

  <!-- Modal Card Container (Adaptive Bottom Sheet on mobile, centered card on desktop) -->
  <div (click)="$event.stopPropagation()"
    class="relative w-full max-h-[92vh] sm:max-h-[88vh] sm:max-w-[620px] bg-white dark:bg-slate-900 border-t sm:border border-slate-200/80 dark:border-slate-800 rounded-t-[28px] sm:rounded-3xl shadow-2xl backdrop-blur-2xl flex flex-col overflow-hidden my-0 sm:my-auto fade-in-up">

    <!-- Mobile Drawer Drag Handle -->
    <div class="sm:hidden pt-3 pb-1 flex justify-center shrink-0 cursor-grab select-none">
      <div class="w-12 h-1.5 rounded-full bg-slate-300 dark:bg-slate-700"></div>
    </div>

    <!-- 1. Modal Header -->
    <div
      class="p-4 sm:px-6 sm:py-4 border-b border-slate-200/80 dark:border-slate-800 shrink-0 relative bg-slate-50/60 dark:bg-slate-900/60">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3 pr-4">
          <div
            class="w-10 h-10 rounded-2xl bg-teal-500/10 dark:bg-teal-500/20 text-teal-600 dark:text-teal-400 border border-teal-500/20 flex items-center justify-center font-extrabold shrink-0">
            <app-icon name="star" [size]="20"></app-icon>
          </div>
          <div>
            <h3 class="font-extrabold text-slate-900 dark:text-white text-base sm:text-lg tracking-tight leading-snug">
              {{ modalTitle }}
            </h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
              Share your verified consultation experience or platform feedback.
            </p>
          </div>
        </div>

        <!-- Modal Close Button -->
        <button (click)="onCancel()" [appTooltip]="'Close Dialog'" [tooltipPlacement]="'left'"
          class="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors outline-none cursor-pointer border-none shrink-0">
          <app-icon name="x" [size]="18"></app-icon>
        </button>
      </div>
    </div>

    <!-- 2. Form Container wrapping Scrollable Body & Sticky Action Footer -->
    <form (submit)="onSubmit()" class="flex flex-col flex-1 overflow-hidden min-h-0">

      <!-- Scrollable Form Body -->
      <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 scrollbar-none no-scrollbar">

        <!-- Auth Context Info Banner -->
        <div *ngIf="currentUser"
          class="p-3 bg-teal-500/10 dark:bg-teal-500/15 border border-teal-500/20 rounded-2xl flex items-center justify-between text-xs shrink-0">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-slate-600 dark:text-slate-300 font-semibold">Author Session:</span>
          </div>
          <span class="font-bold text-teal-700 dark:text-teal-300">{{ currentUser.fullName }} ({{ currentUser.role
            }})</span>
        </div>

        <!-- Guest Name Input (Only if Logged out) -->
        <div *ngIf="!currentUser" class="flex flex-col gap-1.5 shrink-0">
          <label
            class="text-[11px] font-extrabold text-slate-500 dark:text-slate-300 uppercase tracking-wider flex items-center justify-between">
            <span>Your Full Name</span>
            <span class="text-amber-600 dark:text-amber-400 text-[10px] font-bold">*Required for Guest Posts</span>
          </label>
          <input type="text" [(ngModel)]="authorName" name="authorName" placeholder="e.g. Amit Kumar" required
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-slate-100 placeholder-slate-400 text-xs font-semibold outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 transition-all">
        </div>

        <!-- Consultation Quick Picker Options (If Consultations Exist) -->
        <div *ngIf="consultationOptions && consultationOptions.length > 0" class="flex flex-col gap-1.5 shrink-0">
          <label
            class="text-[11px] font-extrabold text-slate-500 dark:text-slate-300 uppercase tracking-wider flex items-center justify-between">
            <span>Quick Select: Consultation or Platform</span>
            <span class="text-teal-600 dark:text-teal-400 text-[10px] font-bold">1-Click Verification</span>
          </label>
          <div class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto no-scrollbar py-0.5">
            <button type="button" (click)="selectTarget('Platform')"
              [appTooltip]="'Review general LegalConnect platform'"
              [class]="targetName === 'Platform' ? 'bg-teal-600 text-white font-bold border-teal-600 shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'"
              class="px-3 py-1.5 text-xs rounded-xl border transition-all cursor-pointer flex items-center gap-1.5">
              <app-icon name="home" [size]="12"></app-icon>
              <span>Platform General</span>
            </button>
            <button type="button" *ngFor="let opt of consultationOptions; trackBy: trackByConsultationId"
              (click)="selectTarget(opt.lawyerName, opt.id)"
              [appTooltip]="'Link review to verified consultation with ' + opt.lawyerName"
              [class]="targetName === opt.lawyerName ? 'bg-teal-600 text-white font-bold border-teal-600 shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'"
              class="px-3 py-1.5 text-xs rounded-xl border transition-all cursor-pointer flex items-center gap-1.5">
              <app-icon name="shield-check" [size]="12" class="text-emerald-400"></app-icon>
              <span>{{ opt.lawyerName }}</span>
              <span class="text-[10px] opacity-75">#{{ opt.id }}</span>
            </button>
          </div>
        </div>

        <!-- Review Subject / Target Advocate -->
        <div class="flex flex-col gap-1.5 shrink-0">
          <label class="text-[11px] font-extrabold text-slate-500 dark:text-slate-300 uppercase tracking-wider">
            Review Subject / Advocate Name
          </label>
          <div class="relative">
            <input type="text" [(ngModel)]="targetName" name="targetName" placeholder="e.g. Platform, Adv. Priya Sharma"
              required
              class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-slate-100 placeholder-slate-400 text-xs font-semibold outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 transition-all">
            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
              <app-icon name="user" [size]="14"></app-icon>
            </div>
          </div>
          <div *ngIf="selectedConsultationId"
            class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 text-[11px] font-semibold mt-0.5">
            <app-icon name="check-circle" [size]="12"></app-icon>
            <span>Authenticated for verified consultation #{{ selectedConsultationId }}</span>
          </div>
        </div>

        <!-- Rating Star Picker with Hover state -->
        <div class="flex flex-col gap-1.5 shrink-0">
          <label class="text-[11px] font-extrabold text-slate-500 dark:text-slate-300 uppercase tracking-wider">
            Overall Rating
          </label>
          <div
            class="flex items-center justify-between p-3 px-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80">
            <div class="flex items-center gap-1">
              <button type="button" *ngFor="let star of starArray; trackBy: trackByNumber" (click)="setRating(star)"
                (mouseenter)="hoverRating = star" (mouseleave)="hoverRating = 0"
                class="p-1 rounded-lg transition-transform hover:scale-125 outline-none cursor-pointer border-none bg-transparent">
                <app-icon name="star" [size]="22"
                  [class]="star <= currentDisplayRating ? 'text-amber-400 fill-amber-400' : 'text-slate-300 dark:text-slate-700'"></app-icon>
              </button>
            </div>
            <span class="text-xs font-extrabold text-amber-600 dark:text-amber-400">
              {{ currentDisplayRating }}.0 / 5 Stars
            </span>
          </div>
        </div>

        <!-- Quick Feedback Tags (Clickable Pills) -->
        <div class="flex flex-col gap-1.5 shrink-0">
          <label class="text-[11px] font-extrabold text-slate-500 dark:text-slate-300 uppercase tracking-wider">
            Quick Feedback Tags (Click to append)
          </label>
          <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto no-scrollbar py-0.5">
            <button type="button" *ngFor="let chip of currentChips; trackBy: trackByChipText" (click)="toggleChip(chip)"
              [appTooltip]="isChipActive(chip) ? 'Click to remove tag' : 'Click to add tag'"
              [ngClass]="isChipActive(chip) ? 'bg-teal-600 text-white font-bold border-teal-600 shadow-sm' : 'bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border-slate-200/80 dark:border-slate-700/80 font-semibold'"
              class="px-2.5 py-1 text-xs rounded-xl border transition-all duration-200 outline-none select-none flex items-center gap-1.5 cursor-pointer active:scale-95">
              <span>{{ chip.text }}</span>
              <app-icon *ngIf="isChipActive(chip)" name="x" [size]="10" class="text-white shrink-0"></app-icon>
            </button>
          </div>
        </div>

        <!-- Review Content Textarea -->
        <div class="flex flex-col gap-1.5 shrink-0">
          <label class="text-[11px] font-extrabold text-slate-500 dark:text-slate-300 uppercase tracking-wider">
            Detailed Review &amp; Commentary
          </label>
          <textarea [(ngModel)]="content" name="content" required
            placeholder="Describe your consultation experience, advocate communication, or platform usability in detail..."
            class="w-full p-3 text-xs rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-slate-100 placeholder-slate-400 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 resize-none h-24 shadow-sm font-medium transition-all"></textarea>
        </div>

      </div>

      <!-- 3. Sticky Bottom Action Footer (Keyboard-safe on mobile) -->
      <div
        class="p-4 sm:px-6 sm:py-4 border-t border-slate-200/80 dark:border-slate-800 shrink-0 bg-slate-50/90 dark:bg-slate-900/90 backdrop-blur-md flex items-center justify-between gap-3 pb-[max(1rem,env(safe-area-inset-bottom))]">
        <button type="button" (click)="onCancel()" [appTooltip]="'Discard changes and exit'"
          class="py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold flex-1 text-center transition-colors cursor-pointer">
          Cancel
        </button>
        <button type="submit" [disabled]="isSubmitting || content.trim().length < 10"
          [appTooltip]="isSubmitting ? 'Saving your review...' : 'Submit review now'"
          class="py-2.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-700 active:scale-95 text-white text-xs font-bold shadow-sm transition-all cursor-pointer flex-1 text-center border-none disabled:bg-slate-200 disabled:dark:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <span *ngIf="isSubmitting" class="flex items-center gap-2">
            <div class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            <span>Saving...</span>
          </span>
          <span *ngIf="!isSubmitting">{{ reviewToEdit ? 'Update Review' : 'Publish Review' }}</span>
        </button>
      </div>

    </form>
  </div>
</div>
