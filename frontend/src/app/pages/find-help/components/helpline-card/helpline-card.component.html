<div
  class="bg-white dark:bg-slate-900 md:border-y md:border-r md:border-slate-200 md:dark:border-slate-800 border-l-4 border-l-rose-500 md:border-l-rose-500 md:dark:border-l-rose-500 rounded-2xl px-5 py-3 sm:p-4 shadow-none md:shadow-sm md:hover:shadow-md transition-all duration-300 animate-scale-up group relative overflow-visible flex flex-col justify-between h-full">

  <div class="ml-0.5 sm:ml-1">
    <div class="flex items-center justify-between gap-2 mb-1 sm:mb-1.5">
      <span
        class="inline-flex items-center px-1.5 py-0.5 rounded text-[8.5px] font-black uppercase tracking-wider bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20">
        Emergency Helpline
      </span>
    </div>
    <h3 class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 m-0 leading-tight">{{helpline.name}}</h3>

    <p
      class="text-[11px] sm:text-xs font-bold text-slate-600 dark:text-slate-300 mt-1 sm:mt-1.5 m-0 flex items-center gap-1.5">
      <span>Number:</span>
      <a href="tel:{{helpline.number}}" [appTooltip]="'Call ' + helpline.name + ' directly at ' + helpline.number"
        tooltipPlacement="top"
        class="text-rose-600 dark:text-rose-400 hover:underline font-extrabold">{{helpline.number}}</a>
    </p>

    <p class="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-500 mt-0.5 sm:mt-1 m-0 leading-relaxed">
      {{helpline.description}}</p>
  </div>

  <!-- Divider -->
  <div class="border-t border-slate-100 dark:border-slate-800/80 my-2 sm:my-3"></div>

  <!-- Action buttons -->
  <div class="flex items-center justify-between gap-2 sm:gap-3 ml-0.5 sm:ml-1 w-full">
    <!-- Primary Dialer -->
    <a href="tel:{{helpline.number}}" [appTooltip]="'Dial emergency helpline ' + helpline.number" tooltipPlacement="top"
      class="bg-rose-500 hover:bg-rose-600 text-white text-[11px] sm:text-xs font-bold py-1 px-2.5 sm:py-1.5 sm:px-3.5 rounded-lg sm:rounded-xl transition-all hover:scale-105 inline-flex items-center justify-center gap-1.5 no-underline shadow-sm flex-grow sm:flex-initial text-center">
      <app-icon name="phone" [size]="14"></app-icon>
      <span>Call</span>
    </a>

    <!-- Quick Actions (Like / Save / WhatsApp Share / QR Display) -->
    <div class="flex items-center gap-1.5">
      <!-- Like / Endorse Button -->
      <app-interactive-like targetType="Helpline" [targetId]="helpline._id || helpline.id" variant="pill" size="sm">
      </app-interactive-like>

      <!-- Save / Bookmark Button (New Unified Component) -->
      <app-bookmark-button targetType="Helpline" [targetId]="helpline._id || helpline.id" [title]="helpline.name"
        [subtitle]="helpline.number" variant="icon" size="sm">
      </app-bookmark-button>

      <!-- Report Issue Trigger -->
      <app-report-trigger targetType="Helpline" [targetId]="helpline._id || helpline.id" [targetTitle]="helpline.name"
        [showLabel]="false">
      </app-report-trigger>

      <!-- QR Code Scanner -->
      <button (click)="onQrClick($event)"
        class="w-[30px] h-[30px] rounded-xl border border-slate-200/80 dark:border-slate-700/60 text-slate-500 dark:text-slate-400 bg-slate-100/70 dark:bg-slate-800/45 hover:text-amber-600 dark:hover:text-amber-400 hover:bg-amber-50/80 dark:hover:bg-amber-400/10 hover:border-amber-300 dark:hover:border-amber-400/35 cursor-pointer transition-all duration-200 flex items-center justify-center shrink-0"
        [appTooltip]="'Generate QR code to scan and open on mobile'" tooltipPlacement="top">
        <app-icon name="qr-code" [size]="14"></app-icon>
      </button>

      <!-- Custom Share Menu component -->
      <app-share-menu [title]="getShareSubject()" [text]="getShareText()" [shareUrl]="getShareUrl()"
        [subject]="getShareSubject()"
        [buttonClass]="'w-[30px] h-[30px] rounded-xl border border-slate-200/80 dark:border-slate-700/60 text-slate-500 dark:text-slate-400 bg-slate-100/70 dark:bg-slate-800/45 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-emerald-50/80 dark:hover:bg-emerald-500/10 hover:border-emerald-300 dark:hover:border-emerald-500/35 cursor-pointer transition-all duration-200 flex items-center justify-center shrink-0'"
        [iconClass]="'w-3.5 h-3.5'" [tooltipText]="'Share helpline contact'" tooltipPlacement="top"
        [customActionLabel]="'Copy Contact Info'" [copyLinkLabel]="'Copy Website Link'"
        (customActionClicked)="copyCardDetails()">
      </app-share-menu>
    </div>

  </div>

</div>
