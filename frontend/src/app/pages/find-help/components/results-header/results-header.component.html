<div
  class="flex flex-col md:flex-row justify-between items-stretch md:items-center bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border border-slate-200/50 dark:border-white/5 rounded-xl p-3 md:py-3.5 md:px-5 mb-2 gap-3 md:gap-0 no-print sticky top-[68px] md:top-[72px] z-[900] shadow-sm">
  <div class="flex flex-col md:flex-row items-start md:items-center gap-2 md:gap-0">
    <button (click)="back.emit()" [appTooltip]="'Return to category selection'" tooltipPlacement="bottom"
      class="hidden md:inline-flex items-center gap-1.5 bg-transparent border-none text-slate-500 hover:text-indigo-600 dark:hover:text-amber-400 font-bold text-xs cursor-pointer transition-all uppercase tracking-wider">
      <app-icon name="arrow-left" [size]="14"></app-icon>
      <span>Back</span>
    </button>

    <span class="hidden md:block h-5 w-px bg-slate-200 dark:bg-slate-800 mx-4"></span>

    <div class="flex flex-col md:flex-row md:items-center text-xs gap-y-1.5 md:gap-y-0 min-w-0 w-full md:w-auto">
      <!-- Category Segment -->
      <div class="flex justify-between items-center w-full md:w-auto">
        <div class="flex items-center gap-1.5">
          <app-icon name="bookmark" [size]="14" class="text-amber-500 shrink-0"></app-icon>
          <span
            class="font-bold text-slate-900 dark:text-white uppercase truncate max-w-[180px] sm:max-w-none">{{activeCategory}}</span>
        </div>

        <!-- Mobile Action Buttons Container (Right-aligned) -->
        <div class="flex items-center gap-2 shrink-0 md:hidden">
          <!-- Mobile Free Aid Checker Button -->
          <button (click)="openFreeAid.emit()" [appTooltip]="'Free Legal Aid Checker'" tooltipPlacement="bottom"
            [ngClass]="freeAidEligible === true ? 'bg-purple-600 border-purple-600 text-white dark:bg-purple-600 px-2.5 w-auto' : 'bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 border-slate-200 dark:border-slate-800 text-purple-600 dark:text-purple-400 px-2.5 w-auto'"
            class="flex items-center justify-center gap-1 border h-8 rounded-xl active:scale-95 transition-all cursor-pointer whitespace-nowrap">
            <app-icon name="zap" [size]="13"></app-icon>
            <span class="text-[10px] font-black uppercase tracking-wider">
              {{ freeAidEligible === true ? 'Eligible' : 'Free Aid' }}
            </span>
          </button>

          <!-- Mobile Filter Button (Only visible on Mobile) -->
          <button (click)="toggleFilters.emit()" [appTooltip]="'Filters'" tooltipPlacement="bottom"
            class="flex items-center justify-center bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 p-1.5 rounded-xl active:scale-95 transition-all cursor-pointer w-8 h-8">
            <span class="relative flex items-center justify-center w-4 h-4">
              <app-icon name="filter" [size]="14" class="text-indigo-600 dark:text-amber-400"></app-icon>
              <span *ngIf="activeFiltersCount > 0"
                class="absolute -top-1.5 -right-1.5 bg-indigo-600 text-white dark:bg-amber-400 dark:text-slate-950 rounded-full flex items-center justify-center text-[8px] font-black border border-white dark:border-slate-900 shadow-sm leading-none shrink-0"
                style="width: 13px; height: 13px;">
                {{activeFiltersCount}}
              </span>
            </span>
          </button>
        </div>
      </div>

      <!-- Desktop Divider Dot (Hidden on Mobile) -->
      <span class="hidden md:block mx-2 text-slate-300 dark:text-slate-700 shrink-0">&bull;</span>

      <!-- Location Segment -->
      <div class="flex items-center flex-wrap gap-y-1">
        <app-icon name="map-pin" [size]="14" class="text-slate-400 mr-1 shrink-0"></app-icon>
        <span
          class="text-slate-600 dark:text-slate-300 truncate max-w-[140px] sm:max-w-[220px]">{{locationQuery}}</span>
        <span class="text-slate-500 dark:text-slate-400 ml-1 shrink-0">({{radius}} km)</span>
        <button (click)="changeLocation.emit()" [appTooltip]="'Modify search location or radius'"
          tooltipPlacement="bottom"
          class="text-[10px] font-bold text-indigo-600 dark:text-amber-400 hover:underline ml-1.5 cursor-pointer uppercase shrink-0 bg-transparent border-0">Change</button>
      </div>
    </div>

  </div>

  <!-- View Mode & Free Aid Segment (Desktop) -->
  <div class="flex items-center gap-3 w-full md:w-auto justify-end">
    <!-- Free Legal Aid Checker Button (Desktop) -->
    <button (click)="openFreeAid.emit()"
      [appTooltip]="'Calculate eligibility for free legal aid under NALSA guidelines'" tooltipPlacement="bottom"
      [ngClass]="freeAidEligible === true ? 'bg-purple-600 text-white border-purple-600 shadow-sm shadow-purple-600/20' : 'bg-purple-50 hover:bg-purple-100 dark:bg-purple-950/20 dark:hover:bg-purple-950/40 text-purple-600 dark:text-purple-400 border-purple-200/60 dark:border-purple-800/60'"
      class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 border rounded-xl text-xs font-bold transition-all active:scale-95 cursor-pointer shadow-sm whitespace-nowrap shrink-0">
      <app-icon name="zap" [size]="13"></app-icon>
      <span class="whitespace-nowrap">{{ freeAidEligible === true ? 'Free Aid: Eligible' : 'Free Aid Checker' }}</span>
    </button>

    <div
      class="flex bg-slate-50 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-800 w-full md:w-auto">
      <button (click)="viewModeChange.emit('list')" [appTooltip]="'Show results as a list layout'"
        tooltipPlacement="bottom"
        [ngClass]="activeViewMode === 'list' ? 'bg-white dark:bg-slate-950 text-indigo-600 dark:text-amber-400 shadow-xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 bg-transparent'"
        class="inline-flex items-center justify-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold cursor-pointer transition-all w-full md:w-auto border-0">
        <app-icon name="list" [size]="14"></app-icon>
        <span>List</span>
      </button>
      <button (click)="viewModeChange.emit('split')" [appTooltip]="'Show results as side-by-side list and map layout'"
        tooltipPlacement="bottom"
        [ngClass]="activeViewMode === 'split' ? 'bg-white dark:bg-slate-950 text-indigo-600 dark:text-amber-400 shadow-xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 bg-transparent'"
        class="hidden md:inline-flex items-center justify-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold cursor-pointer transition-all w-full md:w-auto border-0">
        <app-icon name="layout" [size]="14"></app-icon>
        <span>Split</span>
      </button>
      <button (click)="viewModeChange.emit('map')" [appTooltip]="'Show results as a full screen map layout'"
        tooltipPlacement="bottom"
        [ngClass]="activeViewMode === 'map' ? 'bg-white dark:bg-slate-950 text-indigo-600 dark:text-amber-400 shadow-xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 bg-transparent'"
        class="inline-flex items-center justify-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold cursor-pointer transition-all w-full md:w-auto border-0">
        <app-icon name="map-pin" [size]="14"></app-icon>
        <span>Map</span>
      </button>
    </div>
  </div>
</div>
