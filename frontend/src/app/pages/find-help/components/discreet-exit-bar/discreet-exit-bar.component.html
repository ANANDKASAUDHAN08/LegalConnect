<div class="inline-flex items-center">
  <button type="button" (click)="triggerQuickExit()"
    [appTooltip]="'Discreet Safety Exit: Instantly clears legal session history and opens Google Weather. Shortcut: Press ESC key 3 times rapidly.'"
    tooltipPlacement="bottom"
    class="group inline-flex items-center gap-1 sm:gap-1.5 px-1.5 sm:px-2.5 py-0.5 sm:py-1 rounded-full text-[9px] sm:text-[10px] md:text-[11px] font-bold tracking-tight bg-slate-900 text-white dark:bg-white dark:text-slate-900 hover:bg-red-600 dark:hover:bg-red-600 dark:hover:text-white transition-all shadow-sm cursor-pointer border-0 select-none">

    <!-- Shield / Exit SVG -->
    <svg class="w-3 sm:w-3.5 h-3 sm:h-3.5 text-amber-400 group-hover:text-white transition-colors shrink-0" fill="none"
      stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
    </svg>

    <span class="sm:hidden">Exit</span>
    <span class="hidden sm:inline">Quick Exit</span>
    <span class="opacity-70 text-[9px] font-mono font-semibold hidden md:inline">(ESC x 3)</span>
  </button>
</div>
