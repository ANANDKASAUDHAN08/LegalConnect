<div [class.map-theme-dark]="activeTileTheme === 'dark'" [class.map-theme-light]="activeTileTheme !== 'dark'"
  class="interactive-map-wrapper relative w-full h-full min-h-[450px] lg:min-h-[600px] rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800/80 shadow-md">

  <!-- Leaflet Core Canvas Mount Point -->
  <div #mapContainer class="w-full h-full min-h-[450px] lg:min-h-[600px]"></div>

  <!-- FLOATING TOP BAR OVERLAY: State Focus, Scope & Live Active Telemetry -->
  <div class="absolute top-3.5 left-3.5 z-20 flex items-center gap-2 flex-wrap pointer-events-auto">
    <!-- Active State Pill / Coverage Indicator -->
    <div class="map-glass-card px-3 py-1.5 rounded-2xl flex items-center gap-2 text-xs">
      <span class="w-2 h-2 rounded-full bg-emerald-500 live-pulse-dot"></span>
      <span class="font-bold">
        {{ selectedState ? selectedState : 'National Map' }}
      </span>
      <span
        class="px-2 py-0.5 rounded-full text-[10px] font-black bg-indigo-500/15 text-indigo-600 dark:text-indigo-400">
        {{ totalPlottedPins }} Plotted
      </span>
    </div>

    <!-- Map Scope Switcher (Visible Page 20 vs Pan-India All) -->
    <div class="map-glass-card p-0.5 rounded-xl flex items-center gap-0.5 text-[11px]">
      <button (click)="setMapScope('page')"
        [ngClass]="mapScope === 'page' ? 'bg-indigo-600 text-white font-bold shadow-xs' : 'map-scope-unselected'"
        class="px-2.5 py-1 rounded-xl transition-all cursor-pointer border-0">
        Page ({{ resources.length }})
      </button>
      <button (click)="setMapScope('all')"
        [ngClass]="mapScope === 'all' ? 'bg-indigo-600 text-white font-bold shadow-xs' : 'map-scope-unselected'"
        class="px-2.5 py-1 rounded-xl transition-all cursor-pointer border-0">
        All Results {{ totalCount ? '(' + totalCount + ')' : '' }}
      </button>
    </div>

    <!-- Active State Reset Button -->
    <button *ngIf="selectedState" (click)="resetToAllIndia()"
      class="map-glass-card px-2.5 py-1.5 rounded-2xl text-xs font-bold text-rose-600 dark:text-rose-400 border-rose-500/40 hover:bg-rose-500/10 cursor-pointer transition-all flex items-center gap-1">
      <span>Reset State</span>
      <app-icon name="x" [size]="12"></app-icon>
    </button>
  </div>

  <!-- FLOATING TOP-RIGHT MAP CONTROLS: Zoom, Recenter, Map Theme -->
  <div class="absolute top-3.5 right-3.5 z-20 flex flex-col gap-1.5 pointer-events-auto">
    <!-- Zoom In -->
    <button (click)="zoomIn()" [appTooltip]="'Zoom In'" tooltipPlacement="left" aria-label="Zoom in"
      class="w-8 h-8 map-ctrl-btn">
      <app-icon name="plus" [size]="15"></app-icon>
    </button>

    <!-- Zoom Out -->
    <button (click)="zoomOut()" [appTooltip]="'Zoom Out'" tooltipPlacement="left" aria-label="Zoom out"
      class="w-8 h-8 map-ctrl-btn">
      <app-icon name="minus" [size]="15"></app-icon>
    </button>

    <!-- Recenter Pan-India -->
    <button (click)="resetToAllIndia()" [appTooltip]="'Recenter Pan-India View'" tooltipPlacement="left"
      aria-label="Recenter Pan-India" class="w-8 h-8 map-ctrl-btn">
      <app-icon name="compass" [size]="16"></app-icon>
    </button>

    <!-- Toggle Tile Layer (Dark / Light / OSM) -->
    <button (click)="toggleTileTheme()"
      [appTooltip]="'Switch Map Tile Layer (' + (activeTileTheme === 'dark' ? 'Dark Matter' : activeTileTheme === 'light' ? 'Light Voyager' : 'OpenStreetMap') + ')'"
      tooltipPlacement="left" aria-label="Switch map style" class="w-8 h-8 map-ctrl-btn">
      <app-icon name="layers" [size]="16"
        [color]="activeTileTheme === 'dark' ? '#818cf8' : activeTileTheme === 'light' ? '#f59e0b' : '#10b981'">
      </app-icon>
    </button>
  </div>

  <!-- FLOATING BOTTOM PIN LEGEND & QUICK CATEGORY FILTER OVERLAY -->
  <div class="absolute bottom-3.5 left-3.5 right-3.5 z-20 pointer-events-auto">
    <div
      class="map-glass-card p-2 sm:p-2.5 rounded-2xl flex items-center justify-between gap-2 overflow-x-auto no-scrollbar">
      <div class="flex items-center gap-1.5 sm:gap-2 flex-nowrap text-[10px] sm:text-[11px] font-bold shrink-0">
        <span class="text-[10px] font-black uppercase tracking-wider opacity-60 mr-1 hidden sm:inline">
          Filter Map:
        </span>

        <!-- All Types -->
        <button (click)="selectType('')"
          [ngClass]="!activeType ? 'bg-indigo-600 text-white font-black shadow-xs' : 'map-filter-unselected'"
          class="px-2.5 py-1 rounded-xl cursor-pointer border-0 transition-all">
          All
        </button>

        <!-- Courts -->
        <button (click)="selectType('Court')"
          [ngClass]="activeType === 'Court' ? 'bg-purple-600 text-white font-black shadow-xs' : 'map-filter-unselected'"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl cursor-pointer border-0 transition-all">
          <span class="w-2.5 h-2.5 rounded-full bg-purple-500 shrink-0"></span>
          <span>Courts</span>
        </button>

        <!-- Legal Aid (DLSA) -->
        <button (click)="selectType('LegalAid')"
          [ngClass]="activeType === 'LegalAid' ? 'bg-indigo-600 text-white font-black shadow-xs' : 'map-filter-unselected'"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl cursor-pointer border-0 transition-all">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 shrink-0"></span>
          <span>Legal Aid</span>
        </button>

        <!-- Lok Adalat -->
        <button (click)="selectType('LokAdalat')"
          [ngClass]="activeType === 'LokAdalat' ? 'bg-emerald-600 text-white font-black shadow-xs' : 'map-filter-unselected'"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl cursor-pointer border-0 transition-all">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
          <span>Lok Adalat</span>
        </button>

        <!-- Govt Offices -->
        <button (click)="selectType('GovernmentOffice')"
          [ngClass]="activeType === 'GovernmentOffice' ? 'bg-amber-600 text-white font-black shadow-xs' : 'map-filter-unselected'"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl cursor-pointer border-0 transition-all">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0"></span>
          <span>Govt Offices</span>
        </button>

        <!-- Notaries -->
        <button (click)="selectType('Notary')"
          [ngClass]="activeType === 'Notary' ? 'bg-sky-600 text-white font-black shadow-xs' : 'map-filter-unselected'"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl cursor-pointer border-0 transition-all">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-500 shrink-0"></span>
          <span>Notaries</span>
        </button>

        <!-- Police Stations -->
        <button (click)="selectType('PoliceStation')"
          [ngClass]="activeType === 'PoliceStation' ? 'bg-rose-600 text-white font-black shadow-xs' : 'map-filter-unselected'"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl cursor-pointer border-0 transition-all">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0"></span>
          <span>Police</span>
        </button>
      </div>

      <div class="text-[10px] opacity-60 shrink-0 hidden md:block">
        Click pin to preview & navigate
      </div>
    </div>
  </div>

</div>
