<div (click)="onCardClick($event)" class="notification-card p-3.5 sm:p-5 cursor-pointer group" [ngClass]="{
    'is-virtual': isVirtualScroll(),
    'is-unread': !item().isRead,
    'is-urgent': item().priority === 'urgent' && !item().isRead,
    'is-selected': isSelected()
  }">

  <div class="card-grid">

    <!-- 1. Checkbox & Category Icon Lead Group -->
    <div class="card-lead">
      <!-- Tactile Custom Checkbox -->
      <button type="button" role="checkbox" [attr.aria-checked]="isSelected()" (click)="onCheckboxClick($event)"
        [appTooltip]="isSelected() ? 'Deselect notification' : 'Select notification'" tooltipPlacement="top"
        class="custom-checkbox w-4.5 h-4.5 sm:w-5 sm:h-5 rounded-sm flex items-center justify-center transition-all duration-200 cursor-pointer border shrink-0"
        [ngClass]="{
          'bg-blue-600 border-blue-600 text-white shadow-xs shadow-blue-500/40 scale-105': isSelected(),
          'bg-white/90 dark:bg-slate-800/80 border-slate-300 dark:border-slate-700/80 hover:border-blue-500/80 hover:bg-blue-50/40 text-transparent': !isSelected()
        }">
        <app-icon name="check" [size]="11" class="transition-transform duration-150 stroke-[3]"
          [class.scale-100]="isSelected()" [class.scale-0]="!isSelected()"></app-icon>
      </button>

      <!-- Category Icon Squircle Badge -->
      <div
        class="category-icon-badge w-9 h-9 sm:w-11 sm:h-11 rounded-xl sm:rounded-2xl flex items-center justify-center shrink-0 border transition-transform duration-200 group-hover:scale-105"
        [ngClass]="typeConfig().iconBgClass" [appTooltip]="'Classification: ' + typeConfig().label"
        tooltipPlacement="top">
        <app-icon [name]="typeConfig().icon" [size]="19"></app-icon>
      </div>
    </div>

    <!-- 2. Badges & Timestamp Meta Row -->
    <div class="card-meta">
      <!-- Category Pill -->
      <span
        class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border shadow-2xs inline-flex items-center"
        [ngClass]="typeConfig().badgeClass">
        {{ typeConfig().label }}
      </span>

      <!-- Urgent Priority Pill -->
      <span *ngIf="item().priority === 'urgent'" appTooltip="Urgent Priority: Immediate legal action or review required"
        tooltipPlacement="top"
        class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/30 inline-flex items-center gap-1.5 shadow-2xs">
        <span class="relative flex h-1.5 w-1.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-rose-500"></span>
        </span>
        <span>Urgent</span>
      </span>

      <!-- High Priority Pill -->
      <span *ngIf="item().priority === 'high'" appTooltip="High Priority: Significant docket or hearing milestone"
        tooltipPlacement="top"
        class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/30 shadow-2xs inline-flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
        <span>High Priority</span>
      </span>

      <!-- Relative Timestamp with Clock Icon -->
      <span class="inline-flex items-center gap-1 text-[11px] font-medium text-slate-400 dark:text-slate-400"
        [appTooltip]="'Received: ' + formattedDate()" tooltipPlacement="top">
        <app-icon name="clock" [size]="11" class="opacity-70"></app-icon>
        <span>{{ relativeTime() }}</span>
      </span>

      <!-- Luminous Unread Beacon Dot -->
      <span *ngIf="!item().isRead" class="luminous-beacon shrink-0 ml-0.5"
        [class.luminous-beacon-urgent]="item().priority === 'urgent'"
        [appTooltip]="item().priority === 'urgent' ? 'Urgent unread alert' : 'Unread alert'" tooltipPlacement="top">
      </span>
    </div>

    <!-- 3. Top Action Buttons (Mark Read & Dismiss) -->
    <div class="card-actions" (click)="$event.stopPropagation()">
      <!-- Mark Read Button -->
      <button *ngIf="!item().isRead" type="button" (click)="onMarkRead($event)" [appTooltip]="'Mark as read'"
        tooltipPlacement="top"
        class="inline-flex items-center gap-1.5 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg sm:rounded-xl text-[11px] font-semibold text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400 bg-slate-100/90 hover:bg-blue-50 dark:bg-slate-800/80 dark:hover:bg-blue-950/50 border border-slate-200/80 dark:border-slate-700/80 transition-all cursor-pointer shadow-2xs">
        <app-icon name="check" [size]="12"></app-icon>
        <span class="hidden sm:inline">Mark Read</span>
      </button>

      <!-- Dismiss / Delete Button -->
      <button type="button" (click)="onDelete($event)" [appTooltip]="'Dismiss notification'" tooltipPlacement="top"
        class="p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-all cursor-pointer bg-transparent border-0 flex items-center justify-center">
        <app-icon name="trash" [size]="14"></app-icon>
      </button>
    </div>

    <!-- 4. Title Heading -->
    <h3 class="card-title text-sm sm:text-base font-bold text-slate-900 dark:text-white leading-snug tracking-tight">
      {{ item().title }}
    </h3>

    <!-- 5. Content Body (Summary, Legal Extract Callout, Chips, Action Bar) -->
    <div class="card-body">

      <!-- Summary -->
      <p class="text-xs sm:text-[13.5px] text-slate-600 dark:text-slate-300 leading-relaxed font-normal">
        {{ item().summary }}
      </p>

      <!-- Executive Legal Extract / Docket Callout -->
      <div *ngIf="item().details"
        class="legal-callout relative mt-1 sm:mt-1.5 p-3 sm:p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-800/80 bg-slate-100/70 dark:bg-slate-900/40 backdrop-blur-sm"
        [ngClass]="typeConfig().calloutBorderClass">

        <!-- Callout Sub-Header -->
        <div class="flex items-center gap-1.5 mb-1 text-[10px] font-bold uppercase tracking-wider"
          [ngClass]="typeConfig().calloutAccentClass">
          <app-icon [name]="typeConfig().icon" [size]="11" class="opacity-90"></app-icon>
          <span>{{ calloutLabel() }}</span>
        </div>

        <!-- Extract Typography (Clear editorial font, NOT monospace) -->
        <p class="text-xs sm:text-[13px] text-slate-700 dark:text-slate-200/95 leading-relaxed font-normal">
          {{ item().details }}
        </p>
      </div>

      <!-- Metadata Chips Strip -->
      <div *ngIf="metadataKeys().length > 0" class="flex items-center gap-1.5 flex-wrap pt-0.5">
        <button *ngFor="let key of metadataKeys(); trackBy: trackByKey"
          (click)="copyMetadata(key, item().metadata![key], $event)"
          [appTooltip]="'Click to copy ' + key + ' to clipboard'" tooltipPlacement="top"
          class="meta-chip inline-flex items-center gap-1 px-2.5 py-1 bg-slate-100/90 hover:bg-slate-200/90 dark:bg-slate-800/70 dark:hover:bg-slate-700/70 rounded-lg text-[11px] font-medium text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700/70 transition-all cursor-pointer group/chip">
          <span class="text-slate-400 dark:text-slate-400 font-normal">{{ key }}:</span>
          <span class="font-semibold text-slate-700 dark:text-slate-200">{{ item().metadata![key] }}</span>
          <app-icon name="copy" [size]="10"
            class="text-slate-400 group-hover/chip:text-blue-500 dark:group-hover/chip:text-blue-400 ml-0.5 opacity-60 group-hover/chip:opacity-100 transition-colors"></app-icon>
        </button>
      </div>

      <!-- Bottom Action Bar (Primary CTA & Share Link) -->
      <div *ngIf="item().actionUrl" class="pt-1.5 flex items-center gap-2.5 flex-wrap">
        <!-- Primary Action Pill Button (External Link) -->
        <a *ngIf="isExternalActionUrl()" [href]="item().actionUrl" target="_blank" rel="noopener noreferrer"
          (click)="onCtaClick($event)" [appTooltip]="'Open ' + (item().actionLabel || 'external link') + ' in new tab'"
          tooltipPlacement="top"
          class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg sm:rounded-xl text-xs font-semibold text-blue-700 dark:text-blue-300 bg-blue-500/10 hover:bg-blue-600 hover:text-white dark:bg-blue-500/15 dark:hover:bg-blue-600 dark:hover:text-white border border-blue-500/20 hover:border-blue-600 transition-all duration-200 group/cta shadow-2xs cursor-pointer">
          <span>{{ item().actionLabel || 'View Details' }}</span>
          <app-icon name="external-link" [size]="12"></app-icon>
        </a>

        <!-- Primary Action Pill Button (Internal Angular Route) -->
        <a *ngIf="!isExternalActionUrl()" [routerLink]="item().actionUrl" (click)="onCtaClick($event)"
          [appTooltip]="'Navigate to ' + (item().actionLabel || 'relevant case file')" tooltipPlacement="top"
          class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg sm:rounded-xl text-xs font-semibold text-blue-700 dark:text-blue-300 bg-blue-500/10 hover:bg-blue-600 hover:text-white dark:bg-blue-500/15 dark:hover:bg-blue-600 dark:hover:text-white border border-blue-500/20 hover:border-blue-600 transition-all duration-200 group/cta shadow-2xs cursor-pointer">
          <span>{{ item().actionLabel || 'View Details' }}</span>
          <app-icon name="arrow-right" [size]="12"
            class="transition-transform duration-200 group-hover/cta:translate-x-1"></app-icon>
        </a>

        <!-- Global Share Menu (Native Mobile Share + Desktop Menu) -->
        <app-share-menu (click)="$event.stopPropagation()" [shareUrl]="getShareUrl(item().actionUrl)"
          [title]="item().title" [text]="item().summary" [subject]="item().title" [label]="'Share'"
          [tooltipText]="'Share notification & deep link'" tooltipPlacement="top"
          [buttonClass]="'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg sm:rounded-xl text-xs font-semibold text-emerald-700 dark:text-emerald-300 hover:text-white dark:hover:text-white bg-emerald-500/10 hover:bg-emerald-600 dark:bg-emerald-500/15 dark:hover:bg-emerald-600 border border-emerald-500/25 hover:border-emerald-600 dark:border-emerald-500/30 dark:hover:border-emerald-500 transition-all duration-200 shadow-2xs hover:shadow-xs hover:shadow-emerald-500/25 cursor-pointer active:scale-[0.98]'"
          [iconClass]="'w-3 h-3'">
        </app-share-menu>
      </div>

    </div>

  </div>

</div>
