<div class="w-full animate-[fadeIn_0.3s_ease-out]">

  <!-- Top Header Bar Skeleton -->
  <div class="w-full bg-white dark:bg-[#0d1829] border-b border-slate-200 dark:border-slate-800/80 shadow-sm">
    <div class="w-full lg:w-[90%] mx-auto px-4 sm:px-6 lg:px-0 py-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <!-- Avatar + Name -->
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-xl bg-slate-200 dark:bg-slate-800 animate-pulse flex-shrink-0"></div>
          <div class="space-y-2">
            <div class="w-36 h-4 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
            <div class="flex items-center gap-2">
              <div class="w-44 h-3 bg-slate-200/80 dark:bg-slate-800/70 animate-pulse rounded-md"></div>
              <div class="w-16 h-4 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-full"></div>
            </div>
          </div>
        </div>
        <!-- Milestone Banner Skeleton (Desktop) -->
        <div class="hidden lg:flex items-center gap-2.5 px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800/80">
          <div class="w-28 h-4 bg-slate-200 dark:bg-slate-700 animate-pulse rounded-md"></div>
          <div class="w-16 h-6 bg-slate-200 dark:bg-slate-700 animate-pulse rounded-lg"></div>
        </div>

        <!-- Actions -->
        <div class="hidden sm:flex items-center gap-3">
          <div class="w-24 h-9 rounded-xl bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
          <div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
        </div>
      </div>
    </div>

    <!-- Tab Bar Skeleton (Mobile Only, lg:hidden) -->
    <div
      class="w-full bg-slate-50/50 dark:bg-slate-900/30 border-t border-slate-100 dark:border-slate-800/50 py-2 lg:hidden">
      <div class="w-full mx-auto px-4 flex justify-center gap-2">
        <div class="w-24 h-8 rounded-xl bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
        <div class="w-20 h-8 rounded-xl bg-slate-100 dark:bg-slate-800/50 animate-pulse"></div>
        <div class="w-20 h-8 rounded-xl bg-slate-100 dark:bg-slate-800/50 animate-pulse"></div>
      </div>
    </div>
  </div>

  <!-- Main Content Skeleton -->
  <div class="w-full lg:w-[90%] mx-auto px-3.5 sm:px-6 lg:px-0 py-3 sm:py-4">
    <div class="flex flex-col lg:flex-row gap-8">

      <!-- Left Sidebar Skeleton -->
      <div class="w-full lg:w-80 flex-shrink-0 space-y-4 order-2 lg:order-1">
        <!-- Sidebar Navigation Skeleton Card (Desktop Only) -->
        <div
          class="hidden lg:block rounded-xl bg-white dark:bg-slate-900/60 border border-slate-200/70 dark:border-slate-800/80 p-2 space-y-1">
          <div class="h-9 rounded-xl bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
          <div class="h-9 rounded-xl bg-slate-100 dark:bg-slate-800/50 animate-pulse"></div>
        </div>

        <!-- Account Standing Card -->
        <div
          class="rounded-xl bg-white dark:bg-slate-900/60 border border-slate-200/70 dark:border-slate-800/80 overflow-hidden">
          <div
            class="px-5 pt-4 pb-3 border-b border-slate-100 dark:border-slate-800/60 flex items-center justify-between">
            <div class="w-28 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
            <div class="w-16 h-5 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-full"></div>
          </div>
          <div class="divide-y divide-slate-100 dark:divide-slate-800/60">
            <div class="flex items-center justify-between px-5 py-3">
              <div class="w-24 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
              <div class="w-16 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
            </div>
            <div class="flex items-center justify-between px-5 py-3">
              <div class="w-32 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
              <div class="w-14 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
            </div>
            <div class="flex items-center justify-between px-5 py-3">
              <div class="w-28 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
              <div class="w-14 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
            </div>
          </div>
        </div>

        <!-- Milestone Card -->
        <div
          class="rounded-xl bg-white dark:bg-slate-900/60 border border-slate-200/70 dark:border-slate-800/80 overflow-hidden">
          <div class="px-5 pt-4 pb-3 border-b border-slate-100 dark:border-slate-800/60">
            <div class="w-28 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md mb-2"></div>
            <div class="w-44 h-4 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
          </div>
          <div class="p-4 space-y-3">
            <div *ngFor="let i of [1,2,3,4]" class="p-3 rounded-xl border border-slate-200/60 dark:border-slate-800/60">
              <div class="flex items-center gap-2 mb-2">
                <div class="w-5 h-5 rounded-lg bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                <div class="w-28 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
              </div>
              <div class="space-y-1.5 pl-7">
                <div class="w-36 h-2.5 bg-slate-100 dark:bg-slate-800/50 animate-pulse rounded-md"></div>
                <div class="w-28 h-2.5 bg-slate-100 dark:bg-slate-800/50 animate-pulse rounded-md"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content Card -->
      <div class="flex-1 min-w-0 order-1 lg:order-2">
        <div class="p-5 sm:p-7 rounded-2xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800">

          <!-- Section Header -->
          <div class="flex items-center gap-3.5 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800/60">
            <div class="w-14 h-14 rounded-2xl bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
            <div class="space-y-2">
              <div class="w-40 h-4 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
              <div class="w-60 h-3 bg-slate-100 dark:bg-slate-800/50 animate-pulse rounded-md"></div>
            </div>
          </div>

          <!-- Form Fields Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <div *ngFor="let i of [1,2,3,4,5,6]" class="space-y-2">
              <div class="w-16 h-2 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-sm"></div>
              <div class="h-4 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"
                [style.width]="(50 + (i * 12)) + '%'"></div>
            </div>
          </div>

          <!-- Location Divider -->
          <div class="flex items-center gap-3 my-6">
            <div class="h-px flex-1 bg-slate-100 dark:bg-slate-800/80"></div>
            <div class="w-20 h-3 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"></div>
            <div class="h-px flex-1 bg-slate-100 dark:bg-slate-800/80"></div>
          </div>

          <!-- More Fields -->
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <div *ngFor="let i of [1,2,3]" class="space-y-2">
              <div class="w-12 h-2 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-sm"></div>
              <div class="h-4 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-md"
                [style.width]="(40 + (i * 15)) + '%'"></div>
            </div>
          </div>

          <!-- Bio -->
          <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800/60 space-y-2">
            <div class="w-24 h-2 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-sm"></div>
            <div class="w-full h-3 bg-slate-100 dark:bg-slate-800/50 animate-pulse rounded-md"></div>
            <div class="w-3/4 h-3 bg-slate-100 dark:bg-slate-800/50 animate-pulse rounded-md"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
