<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="scalesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Floating Scales of Justice (Transparent Background - MNC Standard) -->
  <g fill="none" stroke="url(#scalesGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Central Upright Pillar and Base -->
    <path d="M16 4v22M9.5 26h13" stroke-width="2.6" />
    <!-- Horizontal Crossbar -->
    <path d="M4.5 10.5h23" stroke-width="2.6" />
    <!-- Left Scale Pan -->
    <path d="M6 10.5l-3.5 8c0 2.5 7 2.5 7 0L6 10.5z" stroke-width="2" fill="url(#scalesGrad)" fill-opacity="0.2" />
    <!-- Right Scale Pan -->
    <path d="M26 10.5l-3.5 8c0 2.5 7 2.5 7 0L26 10.5z" stroke-width="2" fill="url(#scalesGrad)" fill-opacity="0.2" />
    <!-- Central Pivot Fulcrum Node -->
    <circle cx="16" cy="13.5" r="3" fill="url(#scalesGrad)" stroke="none" />
  </g>
</svg>